<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>原稿帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one slim bar on top, the manuscript fills everything else; the outline slides in from the left, tools open on the right only when asked */
:root {
  --sheet: #fcfcfb;
  --paper: #f3f5f8;
  --hover: #eaeef4;
  --ink: #1c2233;
  --ink-soft: #5d6679;
  --rule: #dde2ea;
  --ai: #27457f;
  --ai-soft: #e2e8f4;
  --shu: #b6412a;
  --shu-soft: #f6e4de;
  --ok: #2c7a55;
  --f-body: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-display: "Shippori Mincho B1", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-text: var(--f-body);
  --f-head: var(--f-display);
  --fs: 18px;
  --lh: 1.9;
  --line-chars: 40;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sheet: #15181f; --paper: #1b1f28; --hover: #252a36; --ink: #e5e2da; --ink-soft: #9ca3b3;
    --rule: #2c3240; --ai: #9bb2e4; --ai-soft: #26304a; --shu: #e47c62; --shu-soft: #3b2621; --ok: #79c6a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sheet: #15181f; --paper: #1b1f28; --hover: #252a36; --ink: #e5e2da; --ink-soft: #9ca3b3;
  --rule: #2c3240; --ai: #9bb2e4; --ai-soft: #26304a; --shu: #e47c62; --shu-soft: #3b2621; --ok: #79c6a1;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sheet); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.6;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
svg { display: block; }

#app {
  height: 100%;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#bar { grid-row: 1; }
#findbar { grid-row: 2; }
.main { grid-row: 3; }

/* ---------- the one bar ---------- */
.bar {
  position: relative; z-index: 20;
  display: grid; align-items: center; gap: 4px 10px;
  grid-template-columns: auto minmax(120px, 1fr) auto auto;
  grid-template-areas: "drawer title tools end";
  padding-block: 6px; border-bottom: 1px solid var(--rule);
  transition: opacity 0.35s ease;
}
body.typing .bar { opacity: 0.3; }
body.typing .bar:hover, body.typing .bar:focus-within { opacity: 1; }
#btnDrawer { grid-area: drawer; }
.crumb {
  grid-area: title; min-width: 0; height: 34px; display: flex; align-items: center; gap: 6px;
  padding: 0 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  font-family: var(--f-display); font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-align: left;
}
.crumb:hover { background: var(--hover); }
.crumb-part { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crumb-sep { flex: none; color: var(--ink-soft); font-family: var(--f-ui); }
.crumb-title { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; }
.bar-tools { grid-area: tools; min-width: 0; display: flex; align-items: center; gap: 4px; }
.bar-end { grid-area: end; position: relative; display: flex; align-items: center; gap: 2px; }
.sep { flex: none; width: 1px; height: 18px; background: var(--rule); margin: 0 4px; }

.tbtn {
  flex: none; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.tbtn:hover { background: var(--hover); }
.tbtn[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); font-weight: 500; }
.tbtn:disabled { opacity: 0.35; cursor: default; background: transparent; }
.tbtn.glyph { font-family: var(--f-body); font-size: 14px; }
.tbtn svg { width: 16px; height: 16px; }
.level-btn { min-width: 6.4em; justify-content: space-between; background: var(--hover); font-weight: 500; }
.level-btn:hover { background: var(--ai-soft); }
.level-btn svg { width: 12px; height: 12px; color: var(--ink-soft); }
.icon {
  flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); cursor: pointer;
}
.icon:hover { background: var(--hover); color: var(--ink); }
.icon svg { width: 20px; height: 20px; }
.seg { flex: none; display: inline-flex; padding: 2px; border-radius: 8px; background: var(--hover); }
.seg .tbtn { height: 28px; padding: 0 10px; }
.seg .tbtn[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgb(10 20 40 / 0.14); }

.count {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.count:hover { background: var(--hover); }
.count b { color: var(--ink); font-size: 14px; font-weight: 500; }
.cnt-sel { color: var(--ai); }
.cnt-sel b { color: var(--ai); }
.save { display: inline-flex; align-items: center; gap: 5px; }
.save .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save.busy .dot { background: var(--ink-soft); }
.save.warn { color: var(--shu); }
.save.warn .dot { background: var(--shu); }

.goal-line { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; }
.goal-line i { display: block; height: 100%; width: 0; background: var(--ai); opacity: 0.55; transition: width 0.3s ease; }
.goal-line.done i { background: var(--ok); opacity: 0.8; }

/* ---------- popovers ---------- */
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30;
  min-width: 220px; max-width: calc(100vw - 32px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 14px 36px -14px rgb(10 20 40 / 0.4); padding: 6px;
}
.menu button {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; text-align: left;
  font-size: 13px; cursor: pointer;
}
.menu button:hover { background: var(--hover); }
.menu kbd { font-family: var(--f-ui); font-size: 11px; color: var(--ink-soft); }
.levels { right: auto; width: 250px; }
.levels button[aria-checked="true"] { background: var(--ai-soft); }
.lv-sample { font-family: var(--f-head); font-weight: 700; line-height: 1.3; }
.lv-sample.l1 { font-size: 21px; }
.lv-sample.l2 { font-size: 17px; }
.lv-sample.l3 { font-size: 14.5px; }
.lv-sample.l0 { font-family: var(--f-text); font-weight: 400; font-size: 13px; }
.levels .muted { padding: 6px 10px 4px; border-top: 1px solid var(--rule); margin-top: 4px; }
.stats { width: 280px; padding: 14px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat-label { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat-main { font-size: 13px; }
.stat-main b { font-size: 20px; font-weight: 500; }
.stat-sub { font-size: 12px; color: var(--ink-soft); }
.goal-set { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.goal-set input { width: 90px; height: 28px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.goal-bar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.goal-bar i { display: block; height: 100%; width: 0; background: var(--ai); }
.goal-bar.done i { background: var(--ok); }
.save-detail { margin: 0; font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 10px; }

/* ---------- find bar ---------- */
.findbar { display: flex; flex-direction: column; gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--rule); }
.find-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.find-row input {
  flex: 1 1 200px; min-width: 0; max-width: 340px; height: 32px; padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
}
.find-row input:focus { outline: none; border-color: var(--ai); }
.find-count { min-width: 5.5em; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

/* ---------- writing area ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; }
.writing {
  margin: 0; border: 0; outline: none; background: transparent; color: var(--ink);
  font-family: var(--f-text); font-size: var(--fs); line-height: var(--lh); font-kerning: none;
  overflow: auto;
}
.vertical .writing {
  writing-mode: vertical-rl; padding: 1.5em 2em;
  width: 100%; height: min(100%, calc(var(--line-chars) * 1em + 3em + 18px));
}
.horizontal .writing {
  writing-mode: horizontal-tb; padding: 2em;
  height: 100%; width: min(100%, calc(var(--line-chars) * 1em + 4em + 18px));
}
.doc { white-space: pre-wrap; overflow-wrap: anywhere; }
.doc p { margin: 0; }
.doc h1, .doc h2, .doc h3 { margin: 0; margin-block: 1.1em 0.5em; font-family: var(--f-head); font-weight: 700; line-height: 1.45; }
.doc h1 { font-size: 1.6em; }
.doc h2 { font-size: 1.3em; }
.doc h3 { font-size: 1.1em; }
.doc > :first-child { margin-block-start: 0; }
#editor { caret-color: var(--ai); }
#preview rt { font-size: 0.5em; font-family: var(--f-text); font-weight: 400; }
#preview .bouten { font-style: normal; -webkit-text-emphasis: sesame; text-emphasis: sesame; }
#preview .tcy { -webkit-text-combine: horizontal; text-combine-upright: all; }
::highlight(find) { background-color: rgb(232 168 40 / 0.32); }
::highlight(find-current) { background-color: rgb(236 150 20 / 0.85); color: #16130c; }
::highlight(check) { background-color: rgb(214 82 52 / 0.22); }

.hint {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 16px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
  padding: 5px 4px 5px 12px; font-size: 12px; color: var(--ink-soft);
  box-shadow: 0 8px 20px -12px rgb(10 20 40 / 0.35);
}
.hint .icon { width: 26px; height: 26px; }
.hint .icon svg { width: 14px; height: 14px; }

/* ---------- side panel (check / settings / file) ---------- */
#panel {
  width: 320px; min-height: 0; overflow: auto;
  border-left: 1px solid var(--rule); padding: 14px 0 14px 16px; margin-left: 12px;
  display: flex; flex-direction: column; gap: 14px;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; color: var(--ink-soft); }
.field select {
  width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
}
.field input[type="range"] { width: 100%; accent-color: var(--ai); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check input { accent-color: var(--ai); margin-top: 4px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; height: 32px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ai); }
.btn.danger { background: var(--shu); border-color: var(--shu); color: var(--sheet); }
.muted { margin: 0; font-size: 12px; color: var(--ink-soft); }
.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hit {
  width: 100%; text-align: left; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
  padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
}
.hit:hover { border-color: var(--ai); }
.hit .where { font-size: 11px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .msg { font-size: 12px; }
.hit .snip { font-family: var(--f-body); font-size: 13px; white-space: pre-wrap; word-break: break-all; }
.hit .snip mark { background: var(--shu-soft); color: var(--shu); border-radius: 2px; }
.ok-note { color: var(--ok); font-size: 13px; }
.table { font-size: 12px; border-collapse: collapse; width: 100%; }
.table td { padding: 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.table td:first-child { white-space: nowrap; padding-right: 12px; }
.table .mono { font-family: var(--f-body); }
.table kbd { font-family: var(--f-ui); }
.confirm-box { border: 1px solid var(--shu); background: var(--shu-soft); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.note-box { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }

/* ---------- outline drawer ---------- */
.drawer {
  position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(86vw, 320px);
  display: flex; flex-direction: column; gap: 14px; overflow: auto;
  background: var(--paper); border-right: 1px solid var(--rule); box-shadow: 10px 0 30px -18px rgb(10 20 40 / 0.45);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform: translateX(-104%); visibility: hidden;
  transition: transform 0.22s ease, visibility 0s linear 0.22s;
}
body.drawer-open .drawer { transform: none; visibility: visible; transition: transform 0.22s ease; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(10 14 24 / 0.28); }
.drawer-head { display: flex; align-items: center; gap: 8px; }
.seal {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 4px;
  background: var(--shu); color: var(--sheet); font-family: var(--f-display); font-size: 16px; line-height: 1;
}
.brand { font-family: var(--f-display); font-size: 16px; letter-spacing: 0.08em; flex: 1; }
.work-title {
  width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--sheet); font-family: var(--f-body); font-size: 15px;
}
.work-title:focus { outline: none; border-color: var(--ai); }
.label { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-soft); font-weight: 500; }
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.toc-item {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer;
}
.toc-item:hover { background: var(--hover); }
.toc-item.is-current { background: var(--ai-soft); }
.toc-item.lv2 { padding-left: 22px; }
.toc-item.lv3 { padding-left: 36px; }
.toc-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-body); }
.toc-item.lv1 .toc-name { font-size: 14.5px; font-weight: 600; }
.toc-item.lv2 .toc-name { font-size: 13.5px; }
.toc-item.lv3 .toc-name { font-size: 13px; color: var(--ink-soft); }
.toc-count { flex: none; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.toc-empty { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin: 0; }
.work-total { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.work-total b { color: var(--ink); font-size: 15px; font-weight: 500; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 8px; font-size: 13px;
}
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 2px 4px; }

/* ---------- narrower screens ---------- */
@media (max-width: 980px) {
  .bar { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "drawer title end" "tools tools tools"; }
  .bar-tools { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .bar-tools::-webkit-scrollbar { display: none; }
}
@media (max-width: 640px) {
  .cnt-genko, .save-text { display: none; }
  .crumb-part:not(:last-child), .crumb-sep { display: none; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .find-row { gap: 4px; }
  .find-row input { flex-basis: 110px; max-width: none; }
  .find-row .tbtn { padding: 0 7px; }
  .find-count { min-width: 0; font-size: 11px; }
  #panel {
    position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; margin: 0;
    border-left: 0; border-top: 1px solid var(--rule); border-radius: 12px 12px 0 0;
    background: var(--paper); box-shadow: 0 -10px 30px -14px rgb(10 20 40 / 0.4);
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, body.drawer-open .drawer, .bar, .goal-line i { transition: none; }
}
</style>
</head>
<body>
<div id="app" lang="ja">
  <header class="bar" id="bar">
    <button type="button" class="icon" id="btnDrawer" aria-label="目次" aria-expanded="false" title="目次（見出しから自動で作られます）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button type="button" class="crumb" id="crumb" title="目次を開く"></button>
    <div class="bar-tools" id="barTools" role="toolbar" aria-label="執筆ツール">
      <button type="button" class="tbtn level-btn" id="btnLevel" aria-haspopup="menu" aria-expanded="false" title="段落の種類（見出しにすると目次に章として並びます）">
        <span id="levelLabel">本文</span>
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" class="tbtn" data-ins="ruby" title="ルビ：文字を選んでから押す。漢字の直後なら、そのまま押して読みを入力">ルビ</button>
      <button type="button" class="tbtn" data-ins="bouten" title="傍点：文字を選んでから押す">傍点</button>
      <button type="button" class="tbtn glyph" data-ins="dash" title="ダッシュ（――）" aria-label="ダッシュを入力">――</button>
      <button type="button" class="tbtn glyph" data-ins="leader" title="三点リーダー（……）" aria-label="三点リーダーを入力">……</button>
      <span class="sep" aria-hidden="true"></span>
      <div class="seg" role="group" aria-label="組方向">
        <button type="button" class="tbtn" id="btnVertical" aria-pressed="true" title="縦書き">縦</button>
        <button type="button" class="tbtn" id="btnHorizontal" aria-pressed="false" title="横書き">横</button>
      </div>
      <button type="button" class="tbtn" id="btnPreview" aria-pressed="false" title="ルビや傍点を表示して確認">プレビュー</button>
      <button type="button" class="tbtn" id="btnFind" aria-pressed="false" title="検索・置換（Ctrl+F）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>検索
      </button>
    </div>
    <div class="bar-end">
      <button type="button" class="count" id="btnStats" aria-haspopup="dialog" aria-expanded="false" title="文字数・目標・保存先">

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'ja';

  const LS_KEY = 'genkocho/v2';
  const LS_KEY_V1 = 'genkocho/v1';
  const OPEN_BRACKETS = '「『（(〈《【〔［“"‘\'';
  const LEVEL_TAGS = ['P', 'H1', 'H2', 'H3'];
  const LEVEL_NAMES = ['本文', '大見出し', '中見出し', '小見出し'];
  const BLOCK_SET = new Set(LEVEL_TAGS);
  const BLOCKISH = /^(DIV|LI|UL|OL|BLOCKQUOTE|H4|H5|H6|PRE|SECTION|ARTICLE|HEADER|FOOTER|TABLE|TR)$/;
  const $ = (s, root = document) => root.querySelector(s);
  const editor = $('#editor');
  const preview = $('#preview');
  const stage = $('#stage');
  const findbar = $('#findbar');
  const panelEl = $('#panel');
  const isTouch = window.matchMedia('(pointer: coarse)').matches;
  const HL = typeof CSS !== 'undefined' && !!CSS.highlights && typeof Highlight === 'function';

  const SAMPLE_MD = [
    '# 第一章　雨の古書店',
    '## 一',
    '　駅前の商店街を抜けた先に、その古書店はあった。硝子《ガラス》戸の向こうで、店主の老人が|頁《ページ》をめくっている。',
    '　雨は朝から降りつづいていた。わたしは傘を畳み、軒下で肩の雫《しずく》を払った。時計は15時を回っていた。',
    '「いらっしゃい。濡れたでしょう」',
    '　老人は顔も上げずにそう言った。棚には背の焼けた文庫本が、隙間なく並んでいる。',
    '## 二',
    '　一冊を手に取ると、間から細い紙片が落ちた。|栞《しおり》だった。押し花の、薄紫の《《すみれ》》が挟まれている。',
    '「それはね、前の持ち主が忘れていったものです」',
    '「返さなくていいんですか」',
    '「返す先がわからないから、本と一緒に旅をしてもらうんです」',
    '　わたしは栞を元の頁に戻した。その日、本は買わなかった。――代わりに、また来ようと決めた。',
    '「あの…また来ます」',
  ].join('\n');

  const defaultSettings = () => ({ vertical: true, font: 'mincho', fs: 18, lh: 1.9, lineChars: 40, autoIndent: true, target: 5000, tcy: true, dimWhileTyping: true });
  function defaultState() {
    return {
      v: 2, title: '（見本）雨宿りの古書店', md: SAMPLE_MD, settings: defaultSettings(),
      updatedAt: 0, syncedAt: 0, dirty: false, pristine: true, caret: 0, hintDismissed: false, recovered: null,
    };
  }

  // ---------- markdown: one line = one block; "#", "##", "###" = headings ----------
  function parseLine(line) {
    const m = /^(#{1,3}) (.*)$/.exec(line);
    if (m) return { level: m[1].length, text: m[2] };
    if (line.startsWith('\\')) return { level: 0, text: line.slice(1) };
    return { level: 0, text: line };
  }
  const fromMd = (md) => md.split('\n').map(parseLine);
  const escapeLine = (t) => (/^(#{1,3} |\\)/.test(t) ? '\\' + t : t);
  const lineOf = (b) => (b.level ? '#'.repeat(b.level) + ' ' + b.text : escapeLine(b.text));
  const toMd = (bs) => bs.map(lineOf).join('\n');
  function chaptersToMd(chapters) {
    return chapters.map(c => ['# ' + (String(c.title || '').replace(/\n/g, ' ') || '無題'), ...String(c.body || '').split('\n').map(escapeLine)].join('\n')).join('\n');
  }

  // ---------- local storage ----------
  let localOk = true;
  function migrateV1(s) {
    if (!s || !Array.isArray(s.chapters) || !s.chapters.length || s.pristine) return null;
    const st = defaultState();
    const lastEdit = Math.max(s.metaUpdatedAt || 0, ...s.chapters.map(c => c.updatedAt || 0));
    st.title = String(s.title || '');
    st.md = chaptersToMd(s.chapters);
    st.settings = Object.assign(defaultSettings(), s.settings || {});
    st.updatedAt = lastEdit;
    st.dirty = (Array.isArray(s.pending) && s.pending.length > 0) || !!s.metaPending;
    st.syncedAt = st.dirty ? 0 : lastEdit;
    st.pristine = false;
    st.hintDismissed = !!s.hintDismissed;
    return st;
  }
  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && s.v === 2 && typeof s.md === 'string') {
          s.settings = Object.assign(defaultSettings(), s.settings || {});
          return Object.assign(defaultState(), s);
        }
      }
      const raw1 = localStorage.getItem(LS_KEY_V1);
      if (raw1) { const m = migrateV1(JSON.parse(raw1)); if (m) return m; }
    } catch { /* start fresh */ }
    return defaultState();
  }
  let localTimer = null;
  function saveLocalSoon() { clearTimeout(localTimer); localTimer = setTimeout(saveLocalNow, 300); }
  function saveLocalNow() {
    clearTimeout(localTimer);
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); localOk = true; } catch { localOk = false; }
    updateSaveState();
  }

  let state = loadState();
  let viewMode = 'edit';
  let panel = null;

  // ---------- text utilities ----------
  const PH = '';
  const RE_BOUTEN = /《《([^《》\n]+?)》》/g;
  const RE_RUBY = /[|｜]([^|｜《》\n]{1,50}?)《([^《》\n]{1,50}?)》/g;
  const RE_AUTORUBY = /([\p{Script=Han}々〆ヵヶ]+)《([^《》\n]{1,50}?)》/gu;
  function stripMarkup(t) {
    return t.replace(/[|｜]《/g, PH).replace(RE_BOUTEN, '$1').replace(RE_RUBY, '$1').replace(RE_AUTORUBY, '$1').replaceAll(PH, '《');
  }
  const cpLen = (s) => { let n = 0; for (const _ of s) n++; return n; };
  const countChars = (t) => cpLen(stripMarkup(t).replace(/[\s　]/g, ''));
  const fmt = (n) => n.toLocaleString('ja-JP');
  const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function lineToHtml(line, tcy) {
    let s = esc(line).replace(/[|｜]《/g, PH);
    s = s.replace(RE_BOUTEN, '<em class="bouten">$1</em>');
    s = s.replace(RE_RUBY, '<ruby>$1<rp>（</rp><rt>$2</rt><rp>）</rp></ruby>');
    s = s.replace(RE_AUTORUBY, '<ruby>$1<rp>（</rp><rt>$2</rt><rp>）</rp></ruby>');
    if (tcy) s = s.replace(/(<[^>]*>)|((?<![0-9.,])[0-9]{1,2}(?![0-9.,])|[!?]{1,2})/g, (m, tag, x) => tag || `<span class="tcy">${x}</span>`);
    return s.replaceAll(PH, '《');
  }

  // ---------- document model ----------
  // blocks mirror the editor's children; "plain" offsets count block texts joined by "\n".
  let blocks = [];
  let starts = [];
  let plainCache = null;
  const levelOf = (el) => Math.max(0, LEVEL_TAGS.indexOf(el.tagName));
  function makeBlock(level, text) {
    const el = document.createElement(LEVEL_TAGS[level]);
    if (text) el.textContent = text; else el.append(document.createElement('br'));
    return el;
  }
  function recompute() {
    starts = new Array(blocks.length);
    let o = 0;
    for (let i = 0; i < blocks.length; i++) { starts[i] = o; o += blocks[i].text.length + 1; }
    plainCache = null;
  }
  const plainLength = () => (blocks.length ? starts[blocks.length - 1] + blocks[blocks.length - 1].text.length : 0);
  const plainText = () => (plainCache ??= blocks.map(b => b.text).join('\n'));
  function renderEditor() {
    if (!blocks.length) blocks = [{ level: 0, text: '' }];
    const frag = document.createDocumentFragment();
    for (const b of blocks) frag.append(makeBlock(b.level, b.text));
    editor.replaceChildren(frag);
    recompute();
  }
  function syncFromDom() {
    blocks = Array.from(editor.children, el => ({ level: levelOf(el), text: el.textContent.replace(/ /g, ' ') }));
    if (!blocks.length) renderEditor(); else recompute();
  }
  function patchBlocks(i, count, nb) {
    const ref = editor.children[i + count] || null;
    for (let j = 0; j < count; j++) { const el = editor.children[i]; if (el) el.remove(); }
    const frag = document.createDocumentFragment();
    for (const b of nb) frag.append(makeBlock(b.level, b.text));
    editor.insertBefore(frag, ref);
    blocks.splice(i, count, ...nb.map(b => ({ level: b.level, text: b.text })));
    if (!blocks.length) { blocks.push({ level: 0, text: '' }); editor.append(makeBlock(0, '')); }
    recompute();
  }
  function locate(off) {
    if (off <= 0 || !blocks.length) return { i: 0, k: 0 };
    let lo = 0, hi = blocks.length - 1;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (starts[mid] <= off) lo = mid; else hi = mid - 1; }
    return { i: lo, k: Math.max(0, Math.min(off - starts[lo], blocks[lo].text.length)) };
  }

  // Browsers leave stray markup (e.g. styled spans after merging paragraphs). Rebuild clean blocks,
  // keeping the selection by dropping marker characters into the DOM before reading it back.
  const MARK_A = '', MARK_B = '';
  function textWithBreaks(node) {
    let s = '';
    const walk = (n) => {
      for (const c of n.childNodes) {
        if (c.nodeType === 3) s += c.data;
        else if (c.nodeName === 'BR') s += '\n';
        else if (c.nodeType === 1) { walk(c); if ((BLOCK_SET.has(c.tagName) || BLOCKISH.test(c.tagName)) && !s.endsWith('\n')) s += '\n'; }
      }
    };
    walk(node);
    return s;
  }
  function blockIsClean(el) {
    if (!BLOCK_SET.has(el.tagName) || el.childNodes.length !== 1) return false;
    const c = el.firstChild;
    if (c.nodeType === 3) return c.data.length > 0 && !c.data.includes('\n');
    return c.nodeName === 'BR';
  }
  function normalizeDom() {
    let bad = !editor.firstElementChild;
    if (!bad) for (const c of editor.childNodes) if (c.nodeType !== 1 || !blockIsClean(c)) { bad = true; break; }
    if (!bad) return false;
    const sel = window.getSelection();
    let marked = false, collapsed = true;
    if (sel.rangeCount) {
      const r = sel.getRangeAt(0);
      if (editor.contains(r.startContainer) && editor.contains(r.endContainer)) {
        collapsed = r.collapsed;
        const rs = r.cloneRange(); rs.collapse(true);
        if (!collapsed) { const re = r.cloneRange(); re.collapse(false); re.insertNode(document.createTextNode(MARK_B)); }
        rs.insertNode(document.createTextNode(MARK_A));
        marked = true;
      }
    }
    const out = [];
    let inline = null;
    const flushInline = () => { if (inline !== null) { inline.split('\n').forEach(t => out.push({ level: 0, text: t })); inline = null; } };
    for (const c of Array.from(editor.childNodes)) {
      if (c.nodeType === 1 && (BLOCK_SET.has(c.tagName) || BLOCKISH.test(c.tagName))) {
        flushInline();
        let t = textWithBreaks(c);
        if (t.endsWith('\n')) t = t.slice(0, -1);
        const level = BLOCK_SET.has(c.tagName) ? levelOf(c) : 0;
        t.split('\n').forEach(line => out.push({ level, text: line }));
      } else if (c.nodeType === 3) inline = (inline ?? '') + c.data;
      else if (c.nodeType === 1) inline = (inline ?? '') + (c.nodeName === 'BR' ? '\n' : textWithBreaks(c));
    }
    flushInline();
    if (!out.length) out.push({ level: 0, text: '' });
    let a = -1, b = -1, off = 0;
    for (const blk of out) {
      let t = blk.text;
      const ia = t.indexOf(MARK_A);
      if (ia >= 0) { a = off + ia; t = t.slice(0, ia) + t.slice(ia + 1); }
      const ib = t.indexOf(MARK_B);
      if (ib >= 0) { b = off + ib; t = t.slice(0, ib) + t.slice(ib + 1); }
      blk.text = t.replace(/ /g, ' ');
      off += blk.text.length + 1;
    }
    blocks = out;
    renderEditor();
    if (marked && a >= 0) setSel(a, collapsed || b < 0 ? a : b, { scroll: false });

  }

  // ---------- selection ----------
  let lastSel = { start: 0, end: 0 };
  function offsetOf(node, off) {
    if (node === editor) return off >= blocks.length ? plainLength() : starts[off];
    let el = node;
    while (el && el.parentNode !== editor) el = el.parentNode;
    if (!el) return 0;
    const i = Array.prototype.indexOf.call(editor.children, el);
    if (i < 0 || i >= blocks.length) return plainLength();
    const r = document.createRange();
    r.setStart(el, 0);
    try { r.setEnd(node, off); } catch { return starts[i]; }
    return starts[i] + Math.min(r.toString().length, blocks[i].text.length);
  }
  function getSel() {
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    const r = sel.getRangeAt(0);
    if (!editor.contains(r.startContainer) || !editor.contains(r.endContainer)) return null;
    const a = offsetOf(r.startContainer, r.startOffset), b = offsetOf(r.endContainer, r.endOffset);
    return a <= b ? { start: a, end: b } : { start: b, end: a };
  }
  function pointAt(off) {
    const { i, k } = locate(off);
    const el = editor.children[i];
    if (!el) return [editor, editor.childNodes.length];
    const t = el.firstChild;
    if (t && t.nodeType === 3) return [t, Math.min(k, t.length)];
    return [el, 0];

  function rangeAt(a, b) {
    const r = document.createRange();
    r.setStart(...pointAt(a));
    r.setEnd(...pointAt(b));
    return r;
  }
  function setSel(a, b = a, { focus = true, scroll = true } = {}) {
    const len = plainLength();
    a = Math.max(0, Math.min(a, len));
    b = Math.max(a, Math.min(b, len));
    if (focus && document.activeElement !== editor) editor.focus({ preventScroll: true });
    const r = rangeAt(a, b);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(r);

  function scrollRectIntoView(box, rect, margin = 48) {
    const ed = box.getBoundingClientRect();
    if (rect.left < ed.left + margin) box.scrollLeft -= ed.left + margin - rect.left;
    else if (rect.right > ed.right - margin) box.scrollLeft += rect.right - (ed.right - margin);
    if (rect.top < ed.top + margin) box.scrollTop -= ed.top + margin - rect.top;
    else if (rect.bottom > ed.bottom - margin) box.scrollTop += rect.bottom - (ed.bottom - margin);
  }
  function scrollToRange(r) {
    let rect = r.getBoundingClientRect();
    if (!rect.width && !rect.height) {
      const el = locate(offsetOf(r.startContainer, r.startOffset)).i;
      const blockEl = editor.children[el];
      if (!blockEl) return;
      rect = blockEl.getBoundingClientRect();
    }
    scrollRectIntoView(editor, rect);
  }
  function scrollToStart(box, el) {
    const ed = box.getBoundingClientRect(), r = el.getBoundingClientRect();

    else box.scrollTop += r.top - (ed.top + 24);

  // ---------- undo history (stored as diffs of the markdown) ----------
  const hist = { undo: [], redo: [], lastMd: '', lastTime: 0 };
  function diffStr(a, b) {
    let s = 0;
    const min = Math.min(a.length, b.length);
    while (s < min && a.charCodeAt(s) === b.charCodeAt(s)) s++;
    let ea = a.length, eb = b.length;
    while (ea > s && eb > s && a.charCodeAt(ea - 1) === b.charCodeAt(eb - 1)) { ea--; eb--; }
    return { start: s, del: a.slice(s, ea), ins: b.slice(s, eb) };
  }
  function adjacent(p, d) {
    if (!p) return false;
    if (!p.del && !d.del) return d.start === p.start + p.ins.length;
    if (!p.ins && !d.ins) return d.start + d.del.length === p.start || d.start === p.start;
    return false;
  }
  function commit(kind, before) {
    const md = toMd(blocks);
    if (md === hist.lastMd) return false;
    const d = diffStr(hist.lastMd, md);
    const now = Date.now();
    const after = getSel() || lastSel;
    const top = hist.undo[hist.undo.length - 1];
    if ((kind === 'typing' || kind === 'delete') && top && top.kind === kind && now - hist.lastTime < 1500 && top.steps.length < 300 && adjacent(top.steps[top.steps.length - 1], d)) {
      top.steps.push(d);
      top.after = after;
    } else {
      hist.undo.push({ kind, steps: [d], before: before || lastSel, after });
      if (hist.undo.length > 300) hist.undo.shift();

  }
  function restore(md, sel) {
    blocks = fromMd(md);

    hist.lastMd = toMd(blocks);
    hist.lastTime = 0;
    state.md = hist.lastMd;
    indentEl = null;
    touch();

    const s = sel || lastSel;
    setSel(s.start, s.end);
    contentChanged();
  }
  function undo() {

  }
  function redo() {
    const g = hist.redo.pop();

    let md = hist.lastMd;
    for (const d of g.steps) md = md.slice(0, d.start) + d.ins + md.slice(d.start + d.del.length);
    hist.undo.push(g);
    restore(md, g.after);
  }

  function touch() {
    state.updatedAt = Date.now();
    state.dirty = true;
    state.pristine = false;
    saveLocalSoon();
    scheduleSync();
    renderHint();
  }

  // ---------- editing ----------
  let composing = false;
  let indentEl = null;
  let findArmed = false;

  function contentChanged() {
    scheduleStats();
    scheduleCaretUi();

    if (panel === 'check') scheduleCheck();
    if (state.settings.dimWhileTyping && !isTouch && document.activeElement === editor) document.body.classList.add('typing');
  }

  // Replace [start, end) with text; "\n" splits paragraphs. With markdown, lines like "# 見出し" become
  // headings, and a heading never merges into the paragraph around the caret.
  function applyEdit(start, end, text, { markdown = false, caret = null, kind = 'insert', before = null, focus = true, select = true } = {}) {
    const sel0 = before || getSel() || lastSel;
    const a = locate(start), z = locate(end);
    const first = blocks[a.i], last = blocks[z.i];
    const head = first.text.slice(0, a.k), tail = last.text.slice(z.k);
    const lines = text.split('\n');
    const parsed = lines.map(l => (markdown ? parseLine(l) : { level: 0, text: l }));
    const nb = [];
    let ci, ck;
    if (lines.length === 1) {
      const p = parsed[0];
      if (!head && !tail) nb.push({ level: p.level || first.level, text: p.text });
      else nb.push({ level: first.level, text: head + (p.level ? lines[0] : p.text) + tail });
      ci = 0;
      ck = nb[0].text.length - tail.length;
    } else {
      const p0 = parsed[0], pl = parsed[parsed.length - 1];
      if (head && p0.level) nb.push({ level: first.level, text: head }, p0);
      else nb.push(head ? { level: first.level, text: head + p0.text } : p0);
      for (let j = 1; j < parsed.length - 1; j++) nb.push(parsed[j]);
      if (!tail) nb.push(pl);
      else if (!head || pl.level) nb.push(pl, { level: last.level, text: tail });
      else nb.push({ level: last.level, text: pl.text + tail });

      ck = nb[ci].text.length - (ci === nb.length - 1 ? tail.length : 0);
    }
    patchBlocks(a.i, z.i - a.i + 1, nb);
    const pos = caret != null ? caret : starts[a.i + ci] + ck;
    indentEl = null;
    if (select) setSel(pos, pos, { focus });
    else { lastSel = { start: pos, end: pos }; scrollToRange(rangeAt(pos, pos)); }
    commit(kind, sel0);
    contentChanged();
  }

  function handleEnter(lineBreak) {
    const s = getSel();
    if (!s) return;
    if (s.end > s.start) applyEdit(s.start, s.end, '', { kind: 'delete', before: s });
    const { i, k } = locate(s.start);
    const b = blocks[i];
    const head = b.text.slice(0, k), tail = b.text.slice(k);
    let topLevel = b.level, botLevel = b.level;
    if (b.level > 0) { if (!tail) botLevel = 0; else if (!head) topLevel = 0; }
    let top = head, bot = tail, ck = 0;
    if (botLevel === 0 && !lineBreak && state.settings.autoIndent) {
      if (b.level === 0 && head === '　' && !tail) top = '';
      if (!/^[　 ]/.test(tail) && !(tail && OPEN_BRACKETS.includes(tail[0]))) { bot = '　' + tail; ck = 1; }
    }
    patchBlocks(i, 1, [{ level: topLevel, text: top }, { level: botLevel, text: bot }]);
    indentEl = ck ? editor.children[i + 1] : null;
    setSel(starts[i + 1] + ck);
    commit('enter', s);
    contentChanged();
  }

  function setLevel(level) {
    if (viewMode !== 'edit') setView('edit');
    const s = getSel() || lastSel;
    const a = locate(s.start), z = locate(s.end);
    const nb = [], shift = [];
    let changed = false;
    for (let i = a.i; i <= z.i; i++) {
      const b = blocks[i];
      let t = b.text, d = 0;
      if (level > 0 && b.level === 0) { const m = /^[　 ]+/.exec(t); if (m) { t = t.slice(m[0].length); d = -m[0].length; } }
      else if (level === 0 && b.level > 0 && state.settings.autoIndent && t && !/^[　 ]/.test(t) && !OPEN_BRACKETS.includes(t[0])) { t = '　' + t; d = 1; }
      if (t !== b.text || level !== b.level) changed = true;
      nb.push({ level, text: t });
      shift.push(d);
    }
    if (!changed) { closePop(); return; }
    patchBlocks(a.i, z.i - a.i + 1, nb);
    const mapK = (p, d) => (d < 0 ? Math.max(0, p.k + d) : p.k + d);
    setSel(starts[a.i] + mapK(a, shift[0]), starts[z.i] + mapK(z, shift[shift.length - 1]), { scroll: false });
    indentEl = null;
    commit('format', s);
    contentChanged();
    updateCaretUi();
  }

  function fixBracketIndent() {
    if (!indentEl) return;
    if (!indentEl.isConnected) { indentEl = null; return; }
    const i = Array.prototype.indexOf.call(editor.children, indentEl);
    const t = blocks[i] ? blocks[i].text : '';
    if (t === '　') return;
    indentEl = null;
    if (blocks[i] && blocks[i].level === 0 && t[0] === '　' && t.length >= 2 && OPEN_BRACKETS.includes(t[1])) {
      const s = getSel();
      patchBlocks(i, 1, [{ level: 0, text: t.slice(1) }]);

  }
  function headingShortcut() {

    const b = blocks[i];
    if (b.level) return false;
    const m = /^[　 ]?(#{1,3}) /.exec(b.text);
    if (!m || k !== m[0].length) return false;
    patchBlocks(i, 1, [{ level: m[1].length, text: b.text.slice(m[0].length) }]);

  }
  function afterUserInput(inputType, data) {

  editor.addEventListener('blur', () => { document.body.classList.remove('typing'); });
  editor.addEventListener('dragstart', (e) => e.preventDefault());
  editor.addEventListener('drop', (e) => e.preventDefault());

  // Copy and paste keep heading levels inside the editor, and give plain lines to other apps.
  function selectionParts(s) {
    const a = locate(s.start), z = locate(s.end);
    const parts = [];
    for (let i = a.i; i <= z.i; i++) {
      const t = blocks[i].text;
      parts.push({ level: blocks[i].level, text: t.slice(i === a.i ? a.k : 0, i === z.i ? z.k : t.length) });
    }
    return parts;
  }
  function writeClipboard(e, s) {
    const parts = selectionParts(s);
    e.clipboardData.setData('text/plain', parts.map(p => p.text).join('\n'));
    e.clipboardData.setData('text/html', '<div data-genkocho="1">' + parts.map(p => { const tag = LEVEL_TAGS[p.level].toLowerCase(); return `<${tag}>${esc(p.text)}</${tag}>`; }).join('') + '</div>');
  }
  editor.addEventListener('copy', (e) => {
    const s = getSel();
    if (!s || s.start === s.end) return;
    e.preventDefault();
    writeClipboard(e, s);
  });
  editor.addEventListener('cut', (e) => {
    const s = getSel();
    if (!s || s.start === s.end) return;
    e.preventDefault();
    writeClipboard(e, s);
    applyEdit(s.start, s.end, '', { kind: 'cut', before: s });
  });
  editor.addEventListener('paste', (e) => {
    e.preventDefault();

    let text = null;
    if (html && html.includes('data-genkocho')) {
      const root = new DOMParser().parseFromString(html, 'text/html').querySelector('[data-genkocho]');

  // In vertical writing the text scrolls sideways; let the mouse wheel do that.
  function verticalWheel(e) {
    if (!state.settings.vertical || e.ctrlKey) return;
    const el = e.currentTarget;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || el.scrollWidth <= el.clientWidth) return;

    e.preventDefault();

  preview.addEventListener('wheel', verticalWheel, { passive: false });
  document.addEventListener('mousemove', (e) => {
    if (document.body.classList.contains('typing') && Math.abs(e.movementX) + Math.abs(e.movementY) > 6) document.body.classList.remove('typing');
  });

  function ins(kind) {
    if (viewMode !== 'edit') setView('edit');
    const s = getSel() || lastSel;
    const sel = plainText().slice(s.start, s.end);
    if ((kind === 'ruby' || kind === 'bouten') && sel.includes('\n')) { toast(kind === 'ruby' ? 'ルビは1行の中の文字に振ってください' : '傍点は1行の中の文字に付けてください'); return; }
    switch (kind) {
      case 'ruby':
        if (sel) applyEdit(s.start, s.end, '｜' + sel + '《》', { caret: s.start + sel.length + 2, before: s });
        else if (/[\p{Script=Han}々〆ヵヶ]$/u.test(plainText().slice(Math.max(0, s.start - 2), s.start))) applyEdit(s.start, s.start, '《》', { caret: s.start + 1, before: s });
        else { toast('ルビを振る文字を選んでから押してください（漢字の直後なら、そのまま押せます）'); setSel(s.start, s.end, { scroll: false }); }
        break;
      case 'bouten': applyEdit(s.start, s.end, '《《' + sel + '》》', { caret: sel ? s.start + sel.length + 4 : s.start + 2, before: s }); break;

      case 'leader': applyEdit(s.start, s.end, '……', { before: s }); break;

  const keepFocus = (e) => { if (e.target.closest('[data-ins], #btnLevel, #levelPop button')) e.preventDefault(); };
  for (const el of [$('#barTools'), $('#levelPop')]) {
    el.addEventListener('pointerdown', keepFocus);
    el.addEventListener('mousedown', keepFocus);
  }
  $('#barTools').addEventListener('click', (e) => { const b = e.target.closest('[data-ins]'); if (b && !b.disabled) ins(b.dataset.ins); });

  document.addEventListener('selectionchange', () => {
    if (composing) return;
    const s = getSel();
    if (!s) { if (document.activeElement !== editor) $('#cntSel').hidden = true; return; }
    lastSel = s;
    state.caret = s.start;
    scheduleCaretUi();
  });

  // ---------- caret-dependent UI: paragraph type, breadcrumb, selection count ----------
  let caretUiQueued = false, lastHead = -2, lastCrumbKey = '';
  function scheduleCaretUi() {
    if (caretUiQueued) return;
    caretUiQueued = true;
    requestAnimationFrame(() => { caretUiQueued = false; updateCaretUi(); });
  }
  function nearestHeading(ci) { for (let i = Math.min(ci, blocks.length - 1); i >= 0; i--) if (blocks[i].level) return i; return -1; }
  function headingPath(ci) {
    const path = [];
    let min = 4;
    for (let i = Math.min(ci, blocks.length - 1); i >= 0 && min > 1; i--) {
      const L = blocks[i].level;
      if (L && L < min) { path.unshift(i); min = L; }
    }
    return path;
  }
  function updateCaretUi() {
    const ci = locate(lastSel.start).i;
    const lvl = blocks[ci] ? blocks[ci].level : 0;
    $('#levelLabel').textContent = LEVEL_NAMES[lvl];
    for (const b of document.querySelectorAll('#levelPop [data-level]')) b.setAttribute('aria-checked', String(Number(b.dataset.level) === lvl));
    const path = headingPath(ci);
    const key = path.map(i => i + ':' + blocks[i].text).join('|') + '#' + state.title;
    if (key !== lastCrumbKey) {
      lastCrumbKey = key;
      const crumb = $('#crumb');
      crumb.textContent = '';
      if (!path.length) {
        const s = document.createElement('span');
        s.className = 'crumb-title';
        s.textContent = state.title || '無題の作品';
        crumb.append(s);
      }
      path.forEach((i, j) => {
        if (j) { const sp = document.createElement('span'); sp.className = 'crumb-sep'; sp.textContent = '›'; crumb.append(sp); }
        const s = document.createElement('span');
        s.className = 'crumb-part';
        s.textContent = blocks[i].text || '（無題の見出し）';
        crumb.append(s);
      });

  function renderPanel() {
    panelEl.textContent = '';
    panelEl.append($('#tpl-' + panel).content.cloneNode(true));
    if (panel === 'check') renderCheck();
    else if (panel === 'settings') setupSettings();
    else if (panel === 'file') setupFile();
  }

  // ---------- find & replace ----------
  const find = { q: '', matches: [], index: -1 };
  let findTimer = null;
  function scheduleFind() { clearTimeout(findTimer); findTimer = setTimeout(() => updateFind({ from: find.index >= 0 ? find.matches[find.index] : lastSel.start, scroll: false }), 250); }
  function computeMatches() {
    find.q = $('#findQ').value;
    find.matches = [];
    if (!find.q) return;
    const text = plainText();
    for (let i = text.indexOf(find.q); i !== -1 && find.matches.length < 5000; i = text.indexOf(find.q, i + find.q.length)) find.matches.push(i);
  }
  function paintFind() {
    if (!HL) return;
    const all = new Highlight(), current = new Highlight();
    const n = find.q.length;
    find.matches.forEach((m, j) => { if (j === find.index) current.add(rangeAt(m, m + n)); else if (j < 2000) all.add(rangeAt(m, m + n)); });
    CSS.highlights.set('find', all);
    CSS.highlights.set('find-current', current);
  }
  function clearFindPaint() { if (HL) { CSS.highlights.delete('find'); CSS.highlights.delete('find-current'); } }
  function showFindCount() {
    $('#findCount').textContent = !find.q ? '' : !find.matches.length ? '見つかりません' : find.index >= 0 ? `${find.index + 1} / ${find.matches.length}件` : `${find.matches.length}件`;
  }
  function revealMatch() {
    const m = find.matches[find.index];
    if (m == null) return;
    if (viewMode !== 'edit') setView('edit');
    if (HL) scrollToRange(rangeAt(m, m + find.q.length));
    else { setSel(m, m + find.q.length); findArmed = true; }
  }
  function updateFind({ from = lastSel.start, scroll = true } = {}) {
    if (findbar.hidden) return;
    computeMatches();
    find.index = find.matches.findIndex(m => m >= from);
    if (find.index < 0 && find.matches.length) find.index = 0;
    paintFind();
    showFindCount();
    if (scroll && find.index >= 0) revealMatch();
  }
  function findStep(dir) {
    if (findbar.hidden) { openFind(); return; }
    if (find.q !== $('#findQ').value) updateFind({ scroll: false });
    const n = find.matches.length;
    if (!n) { showFindCount(); return; }
    find.index = find.index < 0 ? (dir > 0 ? 0 : n - 1) : (find.index + dir + n) % n;
    paintFind();
    showFindCount();
    revealMatch();
  }
  function openFind() {
    findbar.hidden = false;
    $('#btnFind').setAttribute('aria-pressed', 'true');
    const s = getSel() || lastSel;
    const sel = plainText().slice(s.start, s.end);
    const q = $('#findQ');
    if (sel && !sel.includes('\n') && sel.length <= 50) q.value = sel;
    q.focus();
    q.select();
    updateFind({ scroll: false });
  }
  function closeFind() {
    const m = find.matches[find.index];
    const n = find.q.length;
    findbar.hidden = true;
    findArmed = false;
    clearFindPaint();
    $('#btnFind').setAttribute('aria-pressed', 'false');
    if (viewMode !== 'edit') return;
    if (HL && m != null) setSel(m, m + n);
    else if (!isTouch) setSel(lastSel.start, lastSel.end, { scroll: false });
  }
  function setReplace(on) {
    $('#replRow').hidden = !on;
    $('#btnReplace').setAttribute('aria-pressed', String(on));
    if (on) $('#replQ').focus();
  }
  $('#btnFind').addEventListener('click', () => (findbar.hidden ? openFind() : closeFind()));
  $('#findClose').addEventListener('click', closeFind);
  $('#btnReplace').addEventListener('click', () => setReplace($('#replRow').hidden));
  $('#findQ').addEventListener('input', () => updateFind());
  $('#findQ').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); } });
  $('#findNext').addEventListener('click', () => findStep(1));
  $('#findPrev').addEventListener('click', () => findStep(-1));
  $('#replOne').addEventListener('click', () => {
    if (find.q !== $('#findQ').value) updateFind({ scroll: false });
    const m = find.matches[find.index];
    if (m == null) { findStep(1); return; }
    const r = $('#replQ').value;
    applyEdit(m, m + find.q.length, r, { kind: 'replace', focus: !HL, select: !HL });
    updateFind({ from: m + r.length });
  });
  $('#replAll').addEventListener('click', () => {
    const q = $('#findQ').value, r = $('#replQ').value;
    if (!q) return;
    let count = 0;
    const nb = blocks.map(b => {
      if (!b.text.includes(q)) return b;
      const parts = b.text.split(q);
      count += parts.length - 1;
      return { level: b.level, text: parts.join(r) };
    });
    if (!count) { toast('見つかりませんでした'); return; }
    const before = lastSel;
    blocks = nb;
    renderEditor();
    commit('replace', before);
    contentChanged();
    updateFind({ scroll: false });
    toast(`${count}件置換しました（Ctrl/⌘+Z で元に戻せます）`);
  });

  // ---------- notation check ----------
  const CHECKS = [
    { re: /(?<!…)…(?!…)/g, msg: '三点リーダーは「……」と２つ続けて使います' },
    { re: /・{2,}|\.{3,}|。{2,}/g, msg: '「……」（三点リーダー２つ）を使いましょう' },
    { re: /(?<!―)―(?!―)/g, msg: 'ダッシュは「――」と２つ続けて使います' },
    { re: /[！？!?]+(?=[^！？!?\s　」』）)\]〉》】])/g, msg: '「！」「？」の後には全角スペースを１つ空けます' },
    { re: /[!?]+/g, msg: '縦書きでは全角の「！」「？」がおすすめです', verticalOnly: true },
    { re: /。(?=[」』])/g, msg: '閉じかっこの直前の「。」は省くのが一般的です' },
    { re: /^(?=[^\s　「『（(〈《【〔［“"―…＊*◇◆□■○●☆★※])./gu, msg: '段落の頭が字下げされていません' },
  ];
  function runChecks() {
    const hits = [];
    for (let i = 0; i < blocks.length && hits.length < 500; i++) {
      const b = blocks[i];
      if (b.level || !b.text) continue;
      for (const rule of CHECKS) {
        if (rule.verticalOnly && !state.settings.vertical) continue;
        for (const m of b.text.matchAll(rule.re)) hits.push({ i, start: starts[i] + m.index, end: starts[i] + m.index + m[0].length, msg: rule.msg });
      }
      const count = (re) => (b.text.match(re) || []).length;
      if (count(/「/g) !== count(/」/g) || count(/『/g) !== count(/』/g)) hits.push({ i, start: starts[i], end: starts[i] + b.text.length, msg: 'この段落のかぎかっこの開きと閉じの数が合っていません', whole: true });
    }
    return hits.sort((x, y) => x.start - y.start);
  }
  let checkTimer = null;
  function scheduleCheck() { clearTimeout(checkTimer); checkTimer = setTimeout(renderCheck, 600); }
  function renderCheck() {
    const ul = $('#checkList');
    if (!ul) return;
    ul.textContent = '';
    const hits = runChecks();
    if (HL) { const h = new Highlight(); for (const x of hits) h.add(rangeAt(x.start, x.end)); CSS.highlights.set('check', h); }
    if (!hits.length) { ul.innerHTML = '<li class="ok-note">気になる箇所は見つかりませんでした。</li>'; return; }
    const text = plainText();
    for (const h of hits.slice(0, 300)) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'hit';
      b.dataset.s = h.start;
      b.dataset.e = h.end;
      const ls = starts[h.i], le = ls + blocks[h.i].text.length;
      const a = Math.max(ls, h.start - 10), z = Math.min(le, h.end + 10);
      const markEnd = h.whole ? Math.min(h.end, h.start + 20) : h.end;
      const head = nearestHeading(h.i);
      const where = head >= 0 ? (blocks[head].text || '無題の見出し') : '冒頭';
      b.innerHTML = `<span class="where">${esc(where)}</span><span class="msg">${esc(h.msg)}</span>`
        + `<span class="snip">${a > ls ? '…' : ''}${esc(text.slice(a, h.start))}<mark>${esc(text.slice(h.start, markEnd) || '␣')}</mark>${esc(text.slice(markEnd, Math.max(markEnd, z)))}${z < le ? '…' : ''}</span>`;
      li.append(b);
      ul.append(li);
    }
    ul.onclick = (e) => {
      const b = e.target.closest('.hit');
      if (!b) return;
      if (viewMode !== 'edit') setView('edit');
      setSel(Number(b.dataset.s), Number(b.dataset.e));
    };
  }

  // ---------- settings ----------
  function setupSettings() {
    const s = state.settings;
    const bind = (id, key, parse, label) => {
      const el = $('#' + id);
      const show = () => { if (label) $('#' + id + 'V').textContent = label(s[key]); };
      if (el.type === 'checkbox') el.checked = !!s[key]; else el.value = s[key];
      show();
      el.addEventListener(el.type === 'range' ? 'input' : 'change', () => {
        setSetting(key, el.type === 'checkbox' ? el.checked : parse(el.value));
        show();
      });
    };
    bind('setFont', 'font', String);
    bind('setFs', 'fs', Number, v => v + 'px');
    bind('setLh', 'lh', Number, v => Number(v).toFixed(1));
    bind('setLc', 'lineChars', Number, v => v + '字');
    bind('setIndent', 'autoIndent', Boolean);
    bind('setDim', 'dimWhileTyping', Boolean);
    bind('setTcy', 'tcy', Boolean);
  }

  // ---------- export / import ----------
  async function saveFile(filename, text) {
    const c = window.claude;
    const dl = c && typeof c.use === 'function' ? await c.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename, data: text }); toast('書き出しました'); }
      catch (e) { if (!e || e.code !== 'declined') toast('書き出せませんでした' + (e && e.message ? '：' + e.message : '')); }
      return;
    }
    const mime = filename.endsWith('.md') ? 'text/markdown' : 'text/plain';
    const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  const safeName = (s) => (s || '無題').replace(/[\\/:*?"<>|\n\r\t]/g, '_').trim().slice(0, 60) || '無題';
  const stamp = (t) => new Date(t || Date.now()).toISOString().slice(0, 10);
  const mdFile = (title, md) => `---\ntitle: ${JSON.stringify(title || '')}\n---\n${md}\n`;
  function parseMdFile(text) {
    let title = null, body = text;
    const fm = /^---\n([\s\S]*?)\n---\n?/.exec(text);
    if (fm) {
      body = text.slice(fm[0].length);
      const m = /^title:\s*(.*)$/m.exec(fm[1]);
      if (m) { const v = m[1].trim(); try { title = v.startsWith('"') ? JSON.parse(v) : v; } catch { title = v; } }
    }
    if (body.endsWith('\n')) body = body.slice(0, -1);
    return { title, md: body };
  }
  function currentSectionLines() {
    const a = analysis || analyze();
    const cur = sectionAt(a, locate(lastSel.start).i);
    return blocks.slice(cur.start, cur.end).map(b => b.text).join('\n').replace(/^\n+|\n+$/g, '');
  }
  function confirmBox(message, okLabel, onOk) {
    const box = $('#importConfirm');
    box.textContent = '';
    const div = document.createElement('div');
    div.className = 'confirm-box';
    const p = document.createElement('span');
    p.textContent = message;
    const row = document.createElement('div');
    row.className = 'row';
    const ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn danger'; ok.textContent = okLabel;
    const no = document.createElement('button'); no.type = 'button'; no.className = 'btn'; no.textContent = 'やめる';
    ok.onclick = () => { box.textContent = ''; onOk(); };
    no.onclick = () => { box.textContent = ''; };
    row.append(ok, no);
    div.append(p, row);
    box.append(div);
  }
  function replaceDocument(title, md) {
    const before = lastSel;
    if (title != null) state.title = title;
    blocks = fromMd(md);
    renderEditor();
    commit('import', before);
    $('#workTitle').value = state.title;
    lastCrumbKey = '';
    setSel(0, 0, { focus: !isTouch });
    editor.scrollTop = 0; editor.scrollLeft = 0;
    updateDocTitle();
    contentChanged();
    toast('読み込みました（Ctrl/⌘+Z で元に戻せます）');
  }
  function renderRecovered() {
    const box = $('#recoveredBox');
    if (!box) return;
    box.textContent = '';
    const r = state.recovered;
    if (!r) return;
    const div = document.createElement('div');
    div.className = 'note-box';
    const p = document.createElement('span');
    p.textContent = `同期の際に使われなかった版（${new Date(r.at || Date.now()).toLocaleString('ja-JP')}）が残っています。`;
    const row = document.createElement('div');
    row.className = 'row';
    const ex = document.createElement('button'); ex.type = 'button'; ex.className = 'btn'; ex.textContent = 'その版を .md で書き出す';
    const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'btn'; rm.textContent = '破棄する';
    ex.onclick = () => saveFile(`${safeName(r.title)}_別の版_${stamp(r.at)}.md`, mdFile(r.title, r.md));
    rm.onclick = () => { state.recovered = null; saveLocalSoon(); renderRecovered(); };
    row.append(ex, rm);
    div.append(p, row);
    box.append(div);
  }
  function setupFile() {
    $('#storageNote').textContent = cloud.mode === 'cloud'
      ? '原稿は claude.ai のあなたのアカウントに保存され、ほかの人には見えません。'
      : '原稿はこのブラウザに保存されています。ブラウザのデータを消すと失われるため、ときどき .md を書き出して保管してください。';
    renderRecovered();
    $('#expMd').addEventListener('click', () => saveFile(`${safeName(state.title)}_${stamp()}.md`, mdFile(state.title, state.md)));
    $('#expTxt').addEventListener('click', () => saveFile(safeName(state.title) + '.txt', (state.title ? state.title + '\n\n' : '') + plainText() + '\n'));
    $('#copySection').addEventListener('click', () => {
      const text = currentSectionLines();
      const fallback = () => toast('コピーできませんでした。本文を選んで Ctrl/⌘+C でコピーしてください');
      try { navigator.clipboard.writeText(text).then(() => toast('この章の本文をコピーしました'), fallback); } catch { fallback(); }
    });
    $('#importFile').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) { try { text = new TextDecoder('shift_jis').decode(buf); } catch { /* keep utf-8 */ } }
      text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
      const base = file.name.replace(/\.[^.]+$/, '');
      if (/\.(md|markdown)$/i.test(file.name)) {
        const { title, md } = parseMdFile(text);
        confirmBox(`「${title || base}」で、いまの原稿をすべて置き換えます。`, '置き換える', () => replaceDocument(title ?? state.title, md));
      } else if (/\.json$/i.test(file.name)) {
        let data = null;
        try { data = JSON.parse(text); } catch { data = null; }
        if (!data || data.app !== 'genkocho' || !Array.isArray(data.chapters) || !data.chapters.length) { toast('原稿帳のバックアップファイルではありません'); return; }
        confirmBox(`「${data.title || '無題'}」（${data.chapters.length}章）で、いまの原稿をすべて置き換えます。各章は大見出しになります。`, '置き換える', () => replaceDocument(String(data.title || ''), chaptersToMd(data.chapters)));
      } else {
        const before = lastSel;
        const add = [{ level: 1, text: base }, ...text.replace(/\n$/, '').split('\n').map(t => ({ level: 0, text: t }))];
        const at = blocks.length === 1 && !blocks[0].text ? 0 : blocks.length;
        blocks = at === 0 ? add : blocks.concat(add);
        renderEditor();
        commit('import', before);
        if (isTouch) lastSel = { start: starts[at], end: starts[at] }; else setSel(starts[at], starts[at], { scroll: false });
        scrollToStart(editor, editor.children[at]);
        contentChanged();
        toast(`「${base}」を大見出しの章として末尾に追加しました`);
      }
    });
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg, actLabel, actFn) {
    const t = $('#toast'), act = $('#toastAct');
    $('#toastMsg').textContent = msg;
    act.hidden = !actLabel;
    act.textContent = actLabel || '';
    act.onclick = actLabel ? () => { t.hidden = true; actFn(); } : null;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, actLabel ? 7000 : Math.max(2800, msg.length * 90));
  }

  // ---------- keyboard ----------
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === 's') { e.preventDefault(); saveLocalNow(); flush(); toast('保存しました'); }
    else if (mod && k === 'f') { e.preventDefault(); openFind(); }
    else if ((mod && k === 'g') || e.key === 'F3') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape' && !e.isComposing) {
      if (openPop) { const b = openPop.btn; closePop(); if (b.id === 'btnLevel') setSel(lastSel.start, lastSel.end, { scroll: false }); else b.focus(); }
      else if (drawerOpen()) { setDrawer(false); $('#btnDrawer').focus(); }
      else if (!findbar.hidden) closeFind();
      else if (panel) openPanel(null);
      else return;
      e.preventDefault();
    }
  });

  window.addEventListener('beforeunload', () => { saveLocalNow(); flush(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveLocalNow(); flush(); } });

  setView('edit');
  loadDocument(true);
  updateSaveState();
  initCloud();
})();
</script>
</body>
</html>
