<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>原稿帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one slim bar on top, the manuscript fills everything else; chapters slide in from the left, tools open on the right only when asked */
:root {
  --sheet: #fcfcfb;
  --paper: #f3f5f8;
  --hover: #eaeef4;
  --ink: #1c2233;
  --ink-soft: #5d6679;
  --rule: #dde2ea;
  --ai: #27457f;
  --ai-soft: #e2e8f4;
  --shu: #b6412a;
  --shu-soft: #f6e4de;
  --ok: #2c7a55;
  --f-body: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-display: "Shippori Mincho B1", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-text: var(--f-body);
  --fs: 18px;
  --lh: 1.9;
  --line-chars: 40;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sheet: #15181f; --paper: #1b1f28; --hover: #252a36; --ink: #e5e2da; --ink-soft: #9ca3b3;
    --rule: #2c3240; --ai: #9bb2e4; --ai-soft: #26304a; --shu: #e47c62; --shu-soft: #3b2621; --ok: #79c6a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sheet: #15181f; --paper: #1b1f28; --hover: #252a36; --ink: #e5e2da; --ink-soft: #9ca3b3;
  --rule: #2c3240; --ai: #9bb2e4; --ai-soft: #26304a; --shu: #e47c62; --shu-soft: #3b2621; --ok: #79c6a1;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sheet); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.6;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
svg { display: block; }

#app {
  height: 100%;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#bar { grid-row: 1; }
#findbar { grid-row: 2; }
.main { grid-row: 3; }

/* ---------- the one bar ---------- */
.bar {
  position: relative; z-index: 20;
  display: grid; align-items: center; gap: 4px 10px;
  grid-template-columns: auto minmax(120px, 1fr) auto auto;
  grid-template-areas: "drawer title tools end";
  padding-block: 6px; border-bottom: 1px solid var(--rule);
  transition: opacity 0.35s ease;
}
body.typing .bar { opacity: 0.3; }
body.typing .bar:hover, body.typing .bar:focus-within { opacity: 1; }
#btnDrawer { grid-area: drawer; }
.ch-title {
  grid-area: title; min-width: 0; height: 34px;
  border: 1px solid transparent; border-radius: 6px; background: transparent;
  padding: 0 8px; font-family: var(--f-display); font-size: 16px; text-overflow: ellipsis;
}
.ch-title:hover { border-color: var(--rule); }
.ch-title:focus { outline: none; border-color: var(--ai); background: var(--paper); }
.bar-tools { grid-area: tools; min-width: 0; display: flex; align-items: center; gap: 4px; }
.bar-end { grid-area: end; position: relative; display: flex; align-items: center; gap: 2px; }
.sep { flex: none; width: 1px; height: 18px; background: var(--rule); margin: 0 4px; }

.tbtn {
  flex: none; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.tbtn:hover { background: var(--hover); }
.tbtn[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); font-weight: 500; }
.tbtn:disabled { opacity: 0.35; cursor: default; background: transparent; }
.tbtn.glyph { font-family: var(--f-body); font-size: 14px; }
.tbtn svg { width: 16px; height: 16px; }
.icon {
  flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); cursor: pointer;
}
.icon:hover { background: var(--hover); color: var(--ink); }
.icon svg { width: 20px; height: 20px; }
.seg { flex: none; display: inline-flex; padding: 2px; border-radius: 8px; background: var(--hover); }
.seg .tbtn { height: 28px; padding: 0 10px; }
.seg .tbtn[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgb(10 20 40 / 0.14); }

.count {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.count:hover { background: var(--hover); }
.count b { color: var(--ink); font-size: 14px; font-weight: 500; }
.cnt-sel { color: var(--ai); }
.cnt-sel b { color: var(--ai); }
.save { display: inline-flex; align-items: center; gap: 5px; }
.save .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save.busy .dot { background: var(--ink-soft); }
.save.warn { color: var(--shu); }
.save.warn .dot { background: var(--shu); }

.goal-line { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; }
.goal-line i { display: block; height: 100%; width: 0; background: var(--ai); opacity: 0.55; transition: width 0.3s ease; }
.goal-line.done i { background: var(--ok); opacity: 0.8; }

/* ---------- popovers ---------- */
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30;
  min-width: 220px; max-width: calc(100vw - 32px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 14px 36px -14px rgb(10 20 40 / 0.4); padding: 6px;
}
.menu button {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; text-align: left;
  font-size: 13px; cursor: pointer;
}
.menu button:hover { background: var(--hover); }
.stats { width: 270px; padding: 14px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat-label { font-size: 11px; letter-spacing: 0.08em; color: var(--ink-soft); }
.stat-main { font-size: 13px; }
.stat-main b { font-size: 20px; font-weight: 500; }
.stat-sub { font-size: 12px; color: var(--ink-soft); }
.goal-set { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.goal-set input { width: 90px; height: 28px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.goal-bar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.goal-bar i { display: block; height: 100%; width: 0; background: var(--ai); }
.goal-bar.done i { background: var(--ok); }
.save-detail { margin: 0; font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 10px; }

/* ---------- find bar ---------- */
.findbar { display: flex; flex-direction: column; gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--rule); }
.find-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.find-row input {
  flex: 1 1 200px; min-width: 0; max-width: 340px; height: 32px; padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
}
.find-row input:focus { outline: none; border-color: var(--ai); }
.find-count { min-width: 5.5em; font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.find-other { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.chip { border: 1px solid var(--rule); border-radius: 999px; padding: 2px 10px; background: transparent; font-size: 12px; cursor: pointer; }
.chip:hover { border-color: var(--ai); color: var(--ai); }

/* ---------- writing area ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; }
.writing {
  margin: 0; border: 0; outline: none; resize: none; background: transparent; color: var(--ink);
  font-family: var(--f-text); font-size: var(--fs); line-height: var(--lh); font-kerning: none;
  overflow: auto;
}
.vertical .writing {
  writing-mode: vertical-rl; padding: 1.5em 2em;
  width: 100%; height: min(100%, calc(var(--line-chars) * 1em + 3em + 18px));
}
.horizontal .writing {
  writing-mode: horizontal-tb; padding: 2em;
  height: 100%; width: min(100%, calc(var(--line-chars) * 1em + 4em + 18px));
}
.writing::placeholder { color: var(--ink-soft); }
#preview p { margin: 0; }
#preview .pv-title { margin: 0; font-family: var(--f-display); font-size: 1.25em; font-weight: 700; }
.vertical #preview .pv-title { margin-left: 2em; margin-top: 2em; }
.horizontal #preview .pv-title { margin-bottom: 1.5em; }
#preview rt { font-size: 0.5em; font-family: var(--f-text); }
#preview .bouten { font-style: normal; -webkit-text-emphasis: sesame; text-emphasis: sesame; }
#preview .tcy { -webkit-text-combine: horizontal; text-combine-upright: all; }

.hint {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 16px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
  padding: 5px 4px 5px 12px; font-size: 12px; color: var(--ink-soft);
  box-shadow: 0 8px 20px -12px rgb(10 20 40 / 0.35);
}
.hint .icon { width: 26px; height: 26px; }
.hint .icon svg { width: 14px; height: 14px; }

/* ---------- side panel (check / settings / file) ---------- */
#panel {
  width: 320px; min-height: 0; overflow: auto;
  border-left: 1px solid var(--rule); padding: 14px 0 14px 16px; margin-left: 12px;
  display: flex; flex-direction: column; gap: 14px;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; color: var(--ink-soft); }
.field select {
  width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
}
.field input[type="range"] { width: 100%; accent-color: var(--ai); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check input { accent-color: var(--ai); margin-top: 4px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; height: 32px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ai); }
.btn.danger { background: var(--shu); border-color: var(--shu); color: var(--sheet); }
.muted { margin: 0; font-size: 12px; color: var(--ink-soft); }
.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hit {
  width: 100%; text-align: left; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
  padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
}
.hit:hover { border-color: var(--ai); }
.hit .where { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.hit .msg { font-size: 12px; }
.hit .snip { font-family: var(--f-body); font-size: 13px; white-space: pre-wrap; word-break: break-all; }
.hit .snip mark { background: var(--shu-soft); color: var(--shu); border-radius: 2px; }
.ok-note { color: var(--ok); font-size: 13px; }
.table { font-size: 12px; border-collapse: collapse; width: 100%; }
.table td { padding: 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.table td:first-child { white-space: nowrap; padding-right: 12px; }
.table .mono { font-family: var(--f-body); }
.table kbd { font-family: var(--f-ui); }
.confirm-box { border: 1px solid var(--shu); background: var(--shu-soft); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }

/* ---------- chapters drawer ---------- */
.drawer {
  position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(86vw, 320px);
  display: flex; flex-direction: column; gap: 14px; overflow: auto;
  background: var(--paper); border-right: 1px solid var(--rule); box-shadow: 10px 0 30px -18px rgb(10 20 40 / 0.45);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform: translateX(-104%); visibility: hidden;
  transition: transform 0.22s ease, visibility 0s linear 0.22s;
}
body.drawer-open .drawer { transform: none; visibility: visible; transition: transform 0.22s ease; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(10 14 24 / 0.28); }
.drawer-head { display: flex; align-items: center; gap: 8px; }
.seal {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 4px;
  background: var(--shu); color: var(--sheet); font-family: var(--f-display); font-size: 16px; line-height: 1;
}
.brand { font-family: var(--f-display); font-size: 16px; letter-spacing: 0.08em; flex: 1; }
.work-title {
  width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--sheet); font-family: var(--f-body); font-size: 15px;
}
.work-title:focus { outline: none; border-color: var(--ai); }
.label { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-soft); font-weight: 500; }
.ch-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ch-item { border-radius: 6px; }
.ch-item.is-current { background: var(--ai-soft); }
.ch-open {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer;
}
.ch-open:hover { background: var(--hover); }
.is-current .ch-open:hover { background: transparent; }
.ch-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-body); font-size: 14px; }
.is-current .ch-name { font-weight: 600; }
.ch-count { flex: none; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.ch-actions { display: flex; gap: 2px; padding: 0 4px 4px; }
.ch-actions .tbtn { height: 26px; padding: 0 8px; font-size: 12px; color: var(--ink-soft); }
.add-ch { justify-content: center; border: 1px dashed var(--rule); height: 36px; }
.work-total { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.work-total b { color: var(--ink); font-size: 15px; font-weight: 500; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 8px; font-size: 13px;
}
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 2px 4px; }

/* ---------- narrower screens ---------- */
@media (max-width: 900px) {
  .bar { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "drawer title end" "tools tools tools"; }
  .bar-tools { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .bar-tools::-webkit-scrollbar { display: none; }
}
@media (max-width: 640px) {
  .cnt-genko, .save-text { display: none; }
  .ch-title { font-size: 15px; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .find-row { gap: 4px; }
  .find-row input { flex-basis: 110px; max-width: none; }
  .find-row .tbtn { padding: 0 7px; }
  .find-count { min-width: 0; font-size: 11px; }
  #panel {
    position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; margin: 0;
    border-left: 0; border-top: 1px solid var(--rule); border-radius: 12px 12px 0 0;
    background: var(--paper); box-shadow: 0 -10px 30px -14px rgb(10 20 40 / 0.4);
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, body.drawer-open .drawer, .bar, .goal-line i { transition: none; }
}
</style>
</head>
<body>
<div id="app" lang="ja">
  <header class="bar" id="bar">
    <button type="button" class="icon" id="btnDrawer" aria-label="作品と章の一覧" aria-expanded="false" title="作品と章の一覧">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <input id="chTitle" class="ch-title" type="text" aria-label="章タイトル" placeholder="章タイトル" autocomplete="off">
    <div class="bar-tools" id="barTools" role="toolbar" aria-label="執筆ツール">
      <button type="button" class="tbtn" data-ins="ruby" title="ルビ：文字を選んでから押す。漢字の直後なら、そのまま押して読みを入力">ルビ</button>
      <button type="button" class="tbtn" data-ins="bouten" title="傍点：文字を選んでから押す">傍点</button>
      <button type="button" class="tbtn glyph" data-ins="dash" title="ダッシュ（――）" aria-label="ダッシュを入力">――</button>
      <button type="button" class="tbtn glyph" data-ins="leader" title="三点リーダー（……）" aria-label="三点リーダーを入力">……</button>
      <span class="sep" aria-hidden="true"></span>
      <div class="seg" role="group" aria-label="組方向">
        <button type="button" class="tbtn" id="btnVertical" aria-pressed="true" title="縦書き">縦</button>
        <button type="button" class="tbtn" id="btnHorizontal" aria-pressed="false" title="横書き">横</button>
      </div>
      <button type="button" class="tbtn" id="btnPreview" aria-pressed="false" title="ルビや傍点を表示して確認">プレビュー</button>
      <button type="button" class="tbtn" id="btnFind" aria-pressed="false" title="検索・置換（Ctrl+F）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>検索
      </button>
    </div>
    <div class="bar-end">
      <button type="button" class="count" id="btnStats" aria-haspopup="dialog" aria-expanded="false" title="文字数・目標・保存先">
        <span class="cnt-sel" id="cntSel" hidden>選択 <b id="cntSelN">0</b> /</span>
        <span><b id="cntChars">0</b> 字</span>
        <span class="cnt-genko"><span id="cntGenko">0</span>枚</span>
        <span class="save" id="saveState"><i class="dot"></i><span class="save-text" id="saveText">保存済み</span></span>
      </button>
      <button type="button" class="icon" id="btnMenu" aria-label="メニュー" aria-haspopup="menu" aria-expanded="false" title="メニュー">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
      </button>

      <div class="pop stats" id="statsPop" role="dialog" aria-label="文字数と目標" hidden>
        <div class="stat">
          <span class="stat-label">この章</span>
          <span class="stat-main"><b id="stChars">0</b> 字</span>
          <span class="stat-sub">原稿用紙（400字詰め）約 <span id="stGenko">0</span> 枚</span>
        </div>
        <div class="stat">
          <span class="stat-label">作品全体（<span id="stChapters">0</span>章）</span>
          <span class="stat-main"><b id="stTotal">0</b> 字</span>
          <span class="stat-sub">原稿用紙 約 <span id="stTotalGenko">0</span> 枚</span>
        </div>
        <label class="goal-set">1章の目標 <input type="number" id="targetInput" min="0" step="500" inputmode="numeric"> 字</label>
        <div class="goal-bar" id="goalBar"><i id="goalFill"></i></div>
        <span class="stat-sub" id="goalText"></span>
        <p class="save-detail" id="saveDetail"></p>
      </div>

      <div class="pop menu" id="menuPop" role="menu" hidden>
        <button type="button" role="menuitem" data-open="check"><span>表記チェック</span></button>
        <button type="button" role="menuitem" data-open="settings"><span>表示設定</span></button>
        <button type="button" role="menuitem" data-open="file"><span>書き出し・読み込み</span></button>
        <button type="button" role="menuitem" id="btnFull"><span id="fullLabel">全画面表示</span></button>
      </div>
    </div>
    <div class="goal-line" id="goalLine" aria-hidden="true"><i id="goalLineFill"></i></div>
  </header>

  <div class="findbar" id="findbar" hidden>
    <div class="find-row">
      <input type="search" id="findQ" placeholder="検索（Enter で次へ）" aria-label="検索する文字" autocomplete="off">
      <span class="find-count" id="findCount" aria-live="polite"></span>
      <button type="button" class="tbtn" id="findPrev">前へ</button>
      <button type="button" class="tbtn" id="findNext">次へ</button>
      <button type="button" class="tbtn" id="btnReplace" aria-pressed="false">置換</button>
      <button type="button" class="icon" id="findClose" aria-label="検索を閉じる" title="閉じる（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="find-row" id="replRow" hidden>
      <input type="text" id="replQ" placeholder="置き換える文字" aria-label="置き換える文字" autocomplete="off">
      <button type="button" class="tbtn" id="replOne">置換して次へ</button>
      <button type="button" class="tbtn" id="replAll">すべて置換</button>
    </div>
    <div class="find-other" id="findOther" hidden></div>
  </div>

  <div class="main">
    <div class="stage vertical" id="stage">
      <textarea id="text" class="writing" spellcheck="false" aria-label="本文" placeholder="ここに本文を書きます"></textarea>
      <div id="preview" class="writing" hidden tabindex="0" aria-label="プレビュー"></div>
      <div class="hint" id="sampleHint" hidden>
        <span>見本の原稿です。書き換えて始めるか、左上の ☰ から章を追加できます。</span>
        <button type="button" class="icon" id="hintClose" aria-label="案内を閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <aside id="panel" hidden></aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="作品と章">
    <div class="drawer-head">
      <span class="seal" aria-hidden="true">稿</span><span class="brand">原稿帳</span>
      <button type="button" class="icon" id="drawerClose" aria-label="一覧を閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <input id="workTitle" class="work-title" type="text" aria-label="作品タイトル" placeholder="作品タイトル" autocomplete="off">
    <div class="label">章</div>
    <ul class="ch-list" id="chList"></ul>
    <button type="button" class="tbtn add-ch" id="btnAddChapter">＋ 章を追加</button>
    <div class="work-total">作品全体 <b id="workChars">0</b> 字 ・ 原稿用紙 約<span id="workGenko">0</span>枚</div>
  </aside>

  <div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>
</div>

<template id="tpl-check">
  <div class="panel-head"><h2>表記チェック</h2><button type="button" class="icon" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <p class="muted">小説原稿の一般的な決まりごとに沿っているかを確かめます。項目を押すと該当箇所を選択します。</p>
  <ul class="hits" id="checkList"></ul>
</template>

<template id="tpl-settings">
  <div class="panel-head"><h2>表示設定</h2><button type="button" class="icon" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <label class="field"><span>書体</span>
    <select id="setFont"><option value="mincho">明朝体</option><option value="gothic">ゴシック体</option></select>
  </label>
  <label class="field"><span>文字の大きさ <b id="setFsV"></b></span><input type="range" id="setFs" min="13" max="30" step="1"></label>
  <label class="field"><span>行間 <b id="setLhV"></b></span><input type="range" id="setLh" min="1.4" max="2.6" step="0.1"></label>
  <label class="field"><span>1行の字数（画面に収まらないときは画面に合わせます） <b id="setLcV"></b></span><input type="range" id="setLc" min="15" max="60" step="1"></label>
  <label class="check"><input type="checkbox" id="setIndent"><span>改行したら段落頭を自動で字下げする<br><span class="muted">かぎかっこで始まる段落は字下げしません。</span></span></label>
  <label class="check"><input type="checkbox" id="setDim"><span>入力中は上のバーを薄くする（マウスを動かすと戻ります）</span></label>

      <tr><td class="mono">｜親文字《おやもじ》</td><td>ルビ</td></tr>
      <tr><td class="mono">漢字《かんじ》</td><td>漢字だけなら「｜」は省略可</td></tr>
      <tr><td class="mono">《《傍点》》</td><td>傍点</td></tr>
      <tr><td class="mono">｜《</td><td>「《」をそのまま表示</td></tr>
    </table>

  <div class="field"><span>キー操作</span>
    <table class="table">
      <tr><td><kbd>Enter</kbd></td><td>改行して字下げ</td></tr>
      <tr><td><kbd>Shift</kbd>+<kbd>Enter</kbd></td><td>字下げせずに改行</td></tr>
      <tr><td><kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>F</kbd></td><td>検索・置換</td></tr>
      <tr><td><kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>G</kbd></td><td>次を検索（Shift で前）</td></tr>
      <tr><td><kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>S</kbd></td><td>今すぐ保存</td></tr>
      <tr><td><kbd>Esc</kbd></td><td>開いているものを閉じる</td></tr>
    </table>
  </div>

<template id="tpl-file">
  <div class="panel-head"><h2>書き出し・読み込み</h2><button type="button" class="icon" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="field"><span>書き出し（.txt はルビ記法のままなので、小説投稿サイトにそのまま貼れます）</span>
    <div class="row">
      <button type="button" class="btn" id="expChapter">この章を .txt</button>
      <button type="button" class="btn" id="expAll">全章を .txt</button>
      <button type="button" class="btn" id="expJson">バックアップ .json</button>
    </div>
  </div>
  <div class="field"><span>コピー</span>
    <div class="row"><button type="button" class="btn" id="copyChapter">この章の本文をコピー</button></div>
  </div>
  <div class="field"><span>読み込み（.txt は新しい章として追加、.json はバックアップから復元。Shift_JIS のテキストも読めます）</span>
    <input type="file" id="importFile" accept=".txt,.json,text/plain,application/json">
  </div>
  <div id="importConfirm"></div>
  <p class="muted" id="storageNote"></p>
</template>

<script>
(() => {
  'use strict';
  document.documentElement.lang = 'ja';

  const LS_KEY = 'genkocho/v1';
  const OPEN_BRACKETS = '「『（(〈《【〔［“"‘\'';
  const $ = (s, root = document) => root.querySelector(s);
  const ta = $('#text');
  const preview = $('#preview');
  const stage = $('#stage');
  const findbar = $('#findbar');
  const panelEl = $('#panel');
  const isTouch = window.matchMedia('(pointer: coarse)').matches;

  const SAMPLE = [
    '　駅前の商店街を抜けた先に、その古書店はあった。硝子《ガラス》戸の向こうで、店主の老人が|頁《ページ》をめくっている。',
    '　雨は朝から降りつづいていた。わたしは傘を畳み、軒下で肩の雫《しずく》を払った。時計は15時を回っていた。',
    '「いらっしゃい。濡れたでしょう」',
    '　老人は顔も上げずにそう言った。棚には背の焼けた文庫本が、隙間なく並んでいる。',
    '　一冊を手に取ると、間から細い紙片が落ちた。|栞《しおり》だった。押し花の、薄紫の《《すみれ》》が挟まれている。',
    '「それはね、前の持ち主が忘れていったものです」',
    '「返さなくていいんですか」',
    '「返す先がわからないから、本と一緒に旅をしてもらうんです」',
    '　わたしは栞を元の頁に戻した。その日、本は買わなかった。――代わりに、また来ようと決めた。',
    '「あの…また来ます」',
  ].join('\n');

  const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const defaultSettings = () => ({ vertical: true, font: 'mincho', fs: 18, lh: 1.9, lineChars: 40, autoIndent: true, target: 5000, tcy: true, dimWhileTyping: true });
  function defaultState() {
    const id = newId();
    return {
      title: '（見本）雨宿りの古書店',
      chapters: [{ id, title: '第一話　栞の持ち主', body: SAMPLE, updatedAt: 0 }],
      currentId: id, settings: defaultSettings(),
      metaUpdatedAt: 0, pristine: true, pending: [], metaPending: false,
      carets: {}, hintDismissed: false,
    };
  }

  // ---------- local storage ----------
  let localOk = true;
  function loadLocal() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (!s || !Array.isArray(s.chapters) || !s.chapters.length) return null;
      s.settings = Object.assign(defaultSettings(), s.settings || {});
      s.pending = Array.isArray(s.pending) ? s.pending : [];
      s.carets = s.carets && typeof s.carets === 'object' ? s.carets : {};
      return s;
    } catch { return null; }
  }
  let localTimer = null;
  function saveLocalSoon() { clearTimeout(localTimer); localTimer = setTimeout(saveLocalNow, 300); }
  function saveLocalNow() {
    clearTimeout(localTimer);
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); localOk = true; } catch { localOk = false; }
    updateSaveState();
  }

  let state = loadLocal() || defaultState();
  let viewMode = 'edit';
  let panel = null;

  const cur = () => state.chapters.find(c => c.id === state.currentId) || state.chapters[0];

  function markPending(id) {
    if (!state.pending.includes(id)) state.pending.push(id);
    scheduleSync(); saveLocalSoon();
  }
  function touchChapter(ch) { ch.updatedAt = Date.now(); state.pristine = false; markPending(ch.id); }
  function touchMeta() {
    state.metaUpdatedAt = Date.now(); state.pristine = false; state.metaPending = true;
    scheduleSync(); saveLocalSoon();
  }

  // ---------- text utilities ----------
  const PH = '';
  const RE_BOUTEN = /《《([^《》\n]+?)》》/g;
  const RE_RUBY = /[|｜]([^|｜《》\n]{1,50}?)《([^《》\n]{1,50}?)》/g;
  const RE_AUTORUBY = /([\p{Script=Han}々〆ヵヶ]+)《([^《》\n]{1,50}?)》/gu;

  function stripMarkup(t) {
    return t.replace(/[|｜]《/g, PH).replace(RE_BOUTEN, '$1').replace(RE_RUBY, '$1').replace(RE_AUTORUBY, '$1').replaceAll(PH, '《');
  }
  const cpLen = (s) => { let n = 0; for (const _ of s) n++; return n; };
  function countChars(t) { return cpLen(stripMarkup(t).replace(/[\s　]/g, '')); }
  function genkoSheets(t) {
    const lines = stripMarkup(t).split('\n');
    if (lines.length > 1 && lines[lines.length - 1] === '') lines.pop();
    let rows = 0;
    for (const l of lines) rows += Math.max(1, Math.ceil(cpLen(l) / 20));
    return t.trim() ? rows / 20 : 0;
  }
  const fmt = (n) => n.toLocaleString('ja-JP');
  const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const byteLen = (s) => new TextEncoder().encode(s).length;

  function lineToHtml(line, tcy) {
    let s = esc(line).replace(/[|｜]《/g, PH);
    s = s.replace(RE_BOUTEN, '<em class="bouten">$1</em>');
    s = s.replace(RE_RUBY, '<ruby>$1<rp>（</rp><rt>$2</rt><rp>）</rp></ruby>');
    s = s.replace(RE_AUTORUBY, '<ruby>$1<rp>（</rp><rt>$2</rt><rp>）</rp></ruby>');
    if (tcy) s = s.replace(/(<[^>]*>)|((?<![0-9.,])[0-9]{1,2}(?![0-9.,])|[!?]{1,2})/g, (m, tag, x) => tag || `<span class="tcy">${x}</span>`);
    return s.replaceAll(PH, '《');
  }

  const countCache = new Map();
  function chapterStats(ch) {
    const c = countCache.get(ch.id);
    if (c && c.body === ch.body) return c;
    const v = { body: ch.body, chars: countChars(ch.body), genko: genkoSheets(ch.body) };
    countCache.set(ch.id, v);
    return v;
  }

  // ---------- rendering ----------
  function applySettings() {
    const s = state.settings;
    const root = document.documentElement.style;
    root.setProperty('--fs', s.fs + 'px');
    root.setProperty('--lh', String(s.lh));
    root.setProperty('--line-chars', String(s.lineChars));
    root.setProperty('--f-text', s.font === 'gothic' ? 'var(--f-ui)' : 'var(--f-body)');
    stage.classList.toggle('vertical', s.vertical);
    stage.classList.toggle('horizontal', !s.vertical);
    $('#btnVertical').setAttribute('aria-pressed', String(s.vertical));
    $('#btnHorizontal').setAttribute('aria-pressed', String(!s.vertical));
    if (!s.dimWhileTyping) document.body.classList.remove('typing');
  }

  function renderChapterList() {
    const ul = $('#chList');
    ul.textContent = '';
    state.chapters.forEach((ch, i) => {
      const li = document.createElement('li');
      li.className = 'ch-item' + (ch.id === state.currentId ? ' is-current' : '');
      li.dataset.id = ch.id;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ch-open'; b.dataset.act = 'open';
      const name = document.createElement('span'); name.className = 'ch-name'; name.textContent = ch.title || '無題の章';
      const cnt = document.createElement('span'); cnt.className = 'ch-count'; cnt.textContent = fmt(chapterStats(ch).chars) + '字';
      b.append(name, cnt);
      li.append(b);
      if (ch.id === state.currentId) {
        const act = document.createElement('div'); act.className = 'ch-actions';
        act.innerHTML = `<button type="button" class="tbtn" data-act="up" ${i === 0 ? 'disabled' : ''}>↑ 上へ</button>`
          + `<button type="button" class="tbtn" data-act="down" ${i === state.chapters.length - 1 ? 'disabled' : ''}>↓ 下へ</button>`
          + '<button type="button" class="tbtn" data-act="del">削除</button>';
        li.append(act);
      }
      ul.append(li);
    });
  }
  function renderDrawer() { $('#workTitle').value = state.title; renderChapterList(); }

  // Focus the textarea and move the caret so the browser scrolls it into view.
  function placeCaret(s, e = s) {
    ta.focus({ preventScroll: true });
    ta.setSelectionRange(0, 0);
    ta.setSelectionRange(s, e);
  }

  function loadEditor(focus) {
    const ch = cur();
    state.currentId = ch.id;
    ta.value = ch.body;
    $('#chTitle').value = ch.title;
    ta.scrollTop = 0; ta.scrollLeft = 0;
    const saved = state.carets[ch.id];
    const pos = Math.min(typeof saved === 'number' ? saved : ch.body.length, ch.body.length);
    if (viewMode === 'preview') renderPreview();
    else if (focus && !isTouch) placeCaret(pos);
    else ta.setSelectionRange(pos, pos);
  }

  function renderPreview() {
    const ch = cur();
    const tcy = state.settings.vertical && state.settings.tcy;
    preview.innerHTML = `<h2 class="pv-title">${esc(ch.title || '')}</h2>`
      + ch.body.split('\n').map(l => l.trim() ? `<p>${lineToHtml(l, tcy)}</p>` : '<p><br></p>').join('');
    preview.scrollTop = 0; preview.scrollLeft = 0;
  }

  let statsTimer = null;
  function scheduleStats() { clearTimeout(statsTimer); statsTimer = setTimeout(renderStats, 150); }
  function renderStats() {
    const ch = cur();
    const st = chapterStats(ch);
    let total = 0, genko = 0;
    for (const c of state.chapters) { const s = chapterStats(c); total += s.chars; genko += s.genko; }
    const target = Number(state.settings.target) || 0;
    const ratio = target ? Math.min(1, st.chars / target) : 0;
    const done = !!target && st.chars >= target;
    $('#cntChars').textContent = fmt(st.chars);
    $('#cntGenko').textContent = st.genko.toFixed(1);
    $('#goalLineFill').style.width = (ratio * 100) + '%';
    $('#goalLine').classList.toggle('done', done);
    $('#stChars').textContent = fmt(st.chars);
    $('#stGenko').textContent = st.genko.toFixed(1);
    $('#stTotal').textContent = fmt(total);
    $('#stTotalGenko').textContent = genko.toFixed(1);
    $('#stChapters').textContent = state.chapters.length;
    $('#goalFill').style.width = (ratio * 100) + '%';
    $('#goalBar').classList.toggle('done', done);
    $('#goalText').textContent = !target ? '目標は設定されていません' : done ? '目標に達しました' : `あと ${fmt(target - st.chars)} 字（${Math.floor(st.chars / target * 100)}%）`;
    $('#workChars').textContent = fmt(total);
    $('#workGenko').textContent = genko.toFixed(1);
    const item = document.querySelector(`.ch-item[data-id="${ch.id}"] .ch-count`);
    if (item) item.textContent = fmt(st.chars) + '字';
  }

  function renderHint() { $('#sampleHint').hidden = !(state.pristine && !state.hintDismissed); }
  function updateDocTitle() { document.title = (state.title ? state.title + ' | ' : '') + '原稿帳'; }

  function renderAll(focus) {
    applySettings();
    renderDrawer();
    loadEditor(focus);
    renderStats();
    renderHint();
    updateDocTitle();
    if (panel) renderPanel();
  }

  // ---------- save state ----------
  const cloud = { mode: 'local', db: null, col: null, busy: false, again: false, timer: null, error: '', lastSaved: 0, oversize: new Set() };
  let lastWarnShown = '';

  function updateSaveState() {
    let short, detail, cls = '';
    if (cloud.mode === 'connecting') { short = '接続中…'; detail = '保存先に接続しています。このブラウザには保存済みです。'; cls = 'busy'; }
    else if (cloud.mode === 'cloud') {
      if (cloud.error) { short = '保存エラー'; detail = cloud.error; cls = 'warn'; }
      else if (cloud.busy || state.pending.length || state.metaPending) { short = '保存中…'; detail = 'あなたのアカウントに保存しています。'; cls = 'busy'; }
      else {
        const t = cloud.lastSaved ? new Date(cloud.lastSaved).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' }) : '';
        short = '保存済み';
        detail = `claude.ai のあなたのアカウントに保存済み${t ? '（' + t + '）' : ''}。ほかの人には見えず、別の端末からも続きを書けます。`;
      }
    } else if (cloud.mode === 'readonly') { short = 'この端末のみ'; detail = '閲覧権限のため、このブラウザにだけ保存しています。'; cls = 'warn'; }
    else if (!localOk) { short = '保存エラー'; detail = 'このブラウザに保存できません。メニューの「書き出し・読み込み」からバックアップしてください。'; cls = 'warn'; }
    else { short = '保存済み'; detail = 'このブラウザに自動保存しています。ブラウザのデータを消すと失われるため、ときどきメニューの「書き出し・読み込み」からバックアップしてください。'; }
    const el = $('#saveState');
    el.className = 'save' + (cls ? ' ' + cls : '');
    $('#saveText').textContent = short;
    $('#saveDetail').textContent = detail;
    $('#btnStats').title = '文字数・目標 ／ ' + detail;
    if (cls === 'warn') { if (detail !== lastWarnShown) { lastWarnShown = detail; toast(detail); } }
    else lastWarnShown = '';
  }

  function scheduleSync() {
    if (cloud.mode !== 'cloud') return;
    clearTimeout(cloud.timer);
    cloud.timer = setTimeout(flush, 1200);
    updateSaveState();
  }

  async function withRetry(fn) {
    try { return await fn(); } catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
      throw e;
    }
  }

  async function flush() {
    if (cloud.mode !== 'cloud') return;
    if (cloud.busy) { cloud.again = true; return; }
    clearTimeout(cloud.timer);
    cloud.busy = true; cloud.error = '';
    updateSaveState();
    let current = null, metaInFlight = false;
    try {
      while (state.pending.length) {
        current = state.pending.shift();
        const ch = state.chapters.find(c => c.id === current);
        const ref = cloud.col.doc('ch_' + current);
        if (ch) {
          if (byteLen(ch.body) + byteLen(ch.title) > 250000) { cloud.oversize.add(ch.id); current = null; continue; }
          cloud.oversize.delete(ch.id);
          const body = { title: ch.title, body: ch.body, updatedAt: ch.updatedAt };
          await withRetry(() => ref.set(body));
        } else {
          await withRetry(() => ref.delete());
        }
        current = null;
      }
      if (state.metaPending) {
        state.metaPending = false; metaInFlight = true;
        const meta = { title: state.title, order: state.chapters.map(c => c.id), settings: Object.assign({}, state.settings), updatedAt: state.metaUpdatedAt || Date.now() };
        await withRetry(() => cloud.col.doc('meta').set(meta));
        metaInFlight = false;
      }
      cloud.lastSaved = Date.now();
      if (cloud.oversize.size) {
        const names = state.chapters.filter(c => cloud.oversize.has(c.id)).map(c => '「' + (c.title || '無題') + '」');
        if (names.length) cloud.error = names.join('') + 'は長すぎてアカウントに保存できません（このブラウザには保存済み）。章を分けてください。';
      }
    } catch (e) {
      if (current && !state.pending.includes(current)) state.pending.unshift(current);
      if (metaInFlight) state.metaPending = true;
      const code = e && e.code;
      if (code === 'invalid_argument') { cloud.mode = 'readonly'; }
      else if (code === 'revoked' || code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') { cloud.mode = 'local'; }
      else if (code === 'quota_exceeded') { cloud.error = '保存容量の上限に達しました。「書き出し・読み込み」でバックアップし、不要な章を削除してください。'; }
      else { cloud.error = 'アカウントへの保存に失敗しました。少ししてから自動で再試行します（このブラウザには保存済み）。'; setTimeout(scheduleSync, 10000); }
    } finally {
      cloud.busy = false;
      saveLocalSoon();
      updateSaveState();
      if (cloud.again) { cloud.again = false; scheduleSync(); }
    }
  }

  function mergeCloud(docs) {
    const meta = docs.meta;
    const cloudCh = {};
    for (const k of Object.keys(docs)) if (k.startsWith('ch_')) cloudCh[k.slice(3)] = docs[k];
    if (!meta) {
      if (state.pristine) { state.pending = []; state.metaPending = false; }
      else { state.pending = state.chapters.map(c => c.id); state.metaPending = true; }
      return;
    }
    const localById = Object.fromEntries(state.chapters.map(c => [c.id, c]));
    const useCloudMeta = state.pristine || (meta.updatedAt || 0) >= (state.metaUpdatedAt || 0);
    let order;
    if (useCloudMeta) {
      order = Array.isArray(meta.order) ? meta.order.map(String) : [];
      if (typeof meta.title === 'string') state.title = meta.title;
      state.settings = Object.assign(defaultSettings(), meta.settings || {});
      state.metaUpdatedAt = meta.updatedAt || 0;
      state.metaPending = false;
    } else {
      order = state.chapters.map(c => c.id);
      state.metaPending = true;
    }
    const pending = new Set(state.pristine ? [] : state.pending);
    const chapters = [];
    for (const id of order) {
      const l = state.pristine ? null : localById[id];
      const c = cloudCh[id];
      if (l && (!c || (l.updatedAt || 0) > (c.updatedAt || 0))) { chapters.push(l); pending.add(id); }
      else if (c) { chapters.push({ id, title: String(c.title ?? ''), body: String(c.body ?? ''), updatedAt: c.updatedAt || 0 }); pending.delete(id); }
    }
    if (useCloudMeta && !state.pristine) {
      for (const l of state.chapters) {
        if (!order.includes(l.id) && state.pending.includes(l.id) && (l.updatedAt || 0) > (meta.updatedAt || 0)) {
          chapters.push(l); pending.add(l.id); state.metaPending = true;
        }
      }
    }
    if (!chapters.length) return;
    state.chapters = chapters;
    state.pending = [...pending];
    state.pristine = false;
    if (!chapters.some(c => c.id === state.currentId)) state.currentId = chapters[0].id;
  }

  async function initCloud() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { cloud.mode = 'local'; updateSaveState(); return; }
    cloud.mode = 'connecting'; updateSaveState();
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { cloud.mode = 'local'; updateSaveState(); return; }
      const col = db.collection('data/users/' + uid);
      const snap = await withRetry(() => col.get());
      const docs = {};
      for (const d of snap.docs) if (d.exists) docs[d.id] = d.data();
      cloud.db = db; cloud.col = col; cloud.mode = 'cloud';
      const focused = document.activeElement === ta;
      const caret = ta.selectionStart;
      const before = cur().body;
      mergeCloud(docs);
      saveLocalNow();
      const same = cur().body === before;
      renderAll(false);
      if (focused && same) placeCaret(caret);
      if (state.pending.length || state.metaPending) scheduleSync();
      updateSaveState();
    } catch (e) {
      cloud.mode = 'local'; updateSaveState();
    }
  }

  // ---------- editing ----------

  let findArmed = false;

  function insertText(text) {
    ta.focus({ preventScroll: true });
    let ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch { ok = false; }
    if (!ok) {
      ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
      ta.dispatchEvent(new Event('input', { bubbles: true }));
    }
  }

  function fixIndentBeforeBracket() {
    if (indentPos < 0 || composing) return;
    const v = ta.value, p = indentPos;
    if (v[p] !== '　' || v[p - 1] !== '\n') { indentPos = -1; return; }
    const next = v[p + 1];
    if (next === undefined || next === '\n') return;
    indentPos = -1;
    if (OPEN_BRACKETS.includes(next)) {
      const caret = ta.selectionStart;
      ta.setSelectionRange(p, p + 1);
      let ok = false;
      try { ok = document.execCommand('delete'); } catch { ok = false; }
      if (!ok) { ta.setRangeText('', p, p + 1); ta.dispatchEvent(new Event('input', { bubbles: true })); }
      ta.setSelectionRange(caret - 1, caret - 1);
    }
  }

  let checkTimer = null, findTimer = null;
  ta.addEventListener('input', (e) => {

    ch.body = ta.value;

    renderHint();

    if (state.settings.dimWhileTyping && !isTouch) document.body.classList.add('typing');
    if (!e.isComposing) fixIndentBeforeBracket();
    if (panel === 'check') { clearTimeout(checkTimer); checkTimer = setTimeout(renderCheck, 600); }
    if (!findbar.hidden) { clearTimeout(findTimer); findTimer = setTimeout(updateFind, 300); }
  });
  ta.addEventListener('compositionstart', () => { composing = true; });
  ta.addEventListener('compositionend', () => { composing = false; setTimeout(fixIndentBeforeBracket, 0); });
  ta.addEventListener('pointerdown', () => { findArmed = false; });
  ta.addEventListener('blur', () => { document.body.classList.remove('typing'); });

  ta.addEventListener('keydown', (e) => {

      const q = $('#findQ').value;
      if (q && ta.value.slice(ta.selectionStart, ta.selectionEnd) === q) { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); return; }
    }

    if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229 || composing) return;
    if (!state.settings.autoIndent || e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;

    switch (b.dataset.act) {

  // ---------- find & replace ----------
  function matchPositions(v, q) {

  // ---------- notation check ----------
  const CHECKS = [
    { re: /(?<!…)…(?!…)/g, msg: '三点リーダーは「……」と２つ続けて使います' },
    { re: /・{2,}|\.{3,}|。{2,}/g, msg: '「……」（三点リーダー２つ）を使いましょう' },
    { re: /(?<!―)―(?!―)/g, msg: 'ダッシュは「――」と２つ続けて使います' },
    { re: /[！？!?]+(?=[^！？!?\s　」』）)\]〉》】])/g, msg: '「！」「？」の後には全角スペースを１つ空けます' },
    { re: /[!?]+/g, msg: '縦書きでは全角の「！」「？」がおすすめです', verticalOnly: true },
    { re: /。(?=[」』])/g, msg: '閉じかっこの直前の「。」は省くのが一般的です' },
    { re: /^(?=[^\s　「『（(〈《【〔［“"―…＊*◇◆□■○●☆★※])./gmu, msg: '段落の頭が字下げされていません' },
  ];
  function runChecks(text) {
    const hits = [];
    for (const rule of CHECKS) {
      if (rule.verticalOnly && !state.settings.vertical) continue;
      let n = 0;
      for (const m of text.matchAll(rule.re)) {
        hits.push({ start: m.index, end: m.index + m[0].length, msg: rule.msg });
        if (++n >= 100) break;
      }
    }
    let pos = 0;
    for (const line of text.split('\n')) {
      const o1 = (line.match(/「/g) || []).length, c1 = (line.match(/」/g) || []).length;
      const o2 = (line.match(/『/g) || []).length, c2 = (line.match(/』/g) || []).length;
      if (o1 !== c1 || o2 !== c2) hits.push({ start: pos, end: pos + line.length, msg: 'この段落のかぎかっこの開きと閉じの数が合っていません', whole: true });
      pos += line.length + 1;
    }
    return hits.sort((a, b) => a.start - b.start);
  }
  function renderCheck() {
    const ul = $('#checkList');
    if (!ul) return;
    ul.textContent = '';
    const text = ta.value;
    const hits = runChecks(text);
    if (!hits.length) { ul.innerHTML = '<li class="ok-note">気になる箇所は見つかりませんでした。</li>'; return; }
    const lineStarts = [0];
    for (let i = 0; i < text.length; i++) if (text[i] === '\n') lineStarts.push(i + 1);
    const lineOf = (idx) => { let lo = 0, hi = lineStarts.length - 1; while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (lineStarts[mid] <= idx) lo = mid; else hi = mid - 1; } return lo + 1; };
    for (const h of hits.slice(0, 300)) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'hit';
      b.dataset.s = h.start; b.dataset.e = h.end;
      const line = lineOf(h.start);
      const ls = lineStarts[line - 1];
      const nl = text.indexOf('\n', h.start);
      const le = nl === -1 ? text.length : nl;
      const a = Math.max(ls, h.start - 10), z = Math.min(le, h.end + 10);
      const markEnd = h.whole ? Math.min(h.end, h.start + 20) : h.end;
      b.innerHTML = `<span class="where">${line}段落目</span><span class="msg">${esc(h.msg)}</span>`
        + `<span class="snip">${a > ls ? '…' : ''}${esc(text.slice(a, h.start))}<mark>${esc(text.slice(h.start, markEnd) || '␣')}</mark>${esc(text.slice(markEnd, Math.max(markEnd, z)))}${z < le ? '…' : ''}</span>`;
      li.append(b);
      ul.append(li);
    }
    ul.onclick = (e) => {
      const b = e.target.closest('.hit');
      if (b) selectRange(Number(b.dataset.s), Number(b.dataset.e));
    };
  }

  // ---------- settings ----------
  function setupSettings() {
    const s = state.settings;
    const bind = (id, key, parse, label) => {
      const el = $('#' + id);
      const show = () => { if (label) $('#' + id + 'V').textContent = label(s[key]); };
      if (el.type === 'checkbox') el.checked = !!s[key]; else el.value = s[key];
      show();
      el.addEventListener(el.type === 'range' ? 'input' : 'change', () => {
        setSetting(key, el.type === 'checkbox' ? el.checked : parse(el.value));
        show();
      });
    };
    bind('setFont', 'font', String);
    bind('setFs', 'fs', Number, v => v + 'px');
    bind('setLh', 'lh', Number, v => Number(v).toFixed(1));
    bind('setLc', 'lineChars', Number, v => v + '字');
    bind('setIndent', 'autoIndent', Boolean);
    bind('setDim', 'dimWhileTyping', Boolean);
    bind('setTcy', 'tcy', Boolean);
  }

  // ---------- export / import ----------
  async function saveFile(filename, text) {
    const c = window.claude;
    const dl = c && typeof c.use === 'function' ? await c.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename, data: text }); toast('書き出しました'); }
      catch (e) { if (!e || e.code !== 'declined') toast('書き出せませんでした' + (e && e.message ? '：' + e.message : '')); }
      return;
    }
    const mime = filename.endsWith('.json') ? 'application/json' : 'text/plain';
    const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  const safeName = (s) => (s || '無題').replace(/[\\/:*?"<>|\n\r\t]/g, '_').trim().slice(0, 60) || '無題';
  const stamp = () => new Date().toISOString().slice(0, 10);

  function setupFile() {
    $('#storageNote').textContent = cloud.mode === 'cloud'
      ? '原稿は claude.ai のあなたのアカウントに保存され、ほかの人には見えません。'
      : '原稿はこのブラウザに保存されています。ブラウザのデータを消すと失われるため、ときどきバックアップを書き出してください。';
    $('#expChapter').addEventListener('click', () => { const ch = cur(); saveFile(safeName(ch.title) + '.txt', ch.body); });
    $('#expAll').addEventListener('click', () => {
      const text = state.title + '\n\n\n' + state.chapters.map(c => c.title + '\n\n' + c.body).join('\n\n\n') + '\n';
      saveFile(safeName(state.title) + '.txt', text);
    });
    $('#expJson').addEventListener('click', () => {
      const data = { app: 'genkocho', version: 1, exportedAt: new Date().toISOString(), title: state.title, settings: state.settings, chapters: state.chapters.map(({ id, title, body }) => ({ id, title, body })) };
      saveFile(`${safeName(state.title)}_${stamp()}.json`, JSON.stringify(data, null, 2));
    });
    $('#copyChapter').addEventListener('click', () => {
      const text = cur().body;
      const fallback = () => { setView('edit'); ta.focus(); ta.setSelectionRange(0, ta.value.length); toast('本文を選択しました。コピーしてください'); };
      try { navigator.clipboard.writeText(text).then(() => toast('この章の本文をコピーしました'), fallback); } catch { fallback(); }
    });
    $('#importFile').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) { try { text = new TextDecoder('shift_jis').decode(buf); } catch { /* keep utf-8 */ } }
      text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
      if (/\.json$/i.test(file.name)) {
        let data = null;
        try { data = JSON.parse(text); } catch { data = null; }
        if (!data || data.app !== 'genkocho' || !Array.isArray(data.chapters) || !data.chapters.length) { toast('原稿帳のバックアップファイルではありません'); return; }
        const box = $('#importConfirm');
        box.textContent = '';
        const div = document.createElement('div'); div.className = 'confirm-box';
        const p = document.createElement('span');
        p.textContent = `「${data.title || '無題'}」（${data.chapters.length}章）で、いまの原稿をすべて置き換えます。`;
        const row = document.createElement('div'); row.className = 'row';
        row.innerHTML = '<button type="button" class="btn danger" data-r="yes">置き換える</button><button type="button" class="btn" data-r="no">やめる</button>';
        div.append(p, row);
        box.append(div);
        row.addEventListener('click', (ev) => {
          const r = ev.target.closest('[data-r]');
          if (!r) return;
          box.textContent = '';
          if (r.dataset.r === 'yes') restoreBackup(data);
        });
        return;
      }
      const id = newId();
      const ch = { id, title: file.name.replace(/\.[^.]+$/, ''), body: text, updatedAt: Date.now() };
      state.chapters.push(ch);
      touchChapter(ch);
      touchMeta();
      openChapter(id);
      toast(`「${ch.title}」を章として追加しました`);
    });
  }

  function restoreBackup(data) {
    const oldIds = state.chapters.map(c => c.id);
    const now = Date.now();
    state.title = String(data.title || '');
    state.settings = Object.assign(defaultSettings(), data.settings || {});
    const seen = new Set();
    state.chapters = data.chapters.map(c => {
      let id = /^[A-Za-z0-9_-]{1,40}$/.test(String(c.id)) ? String(c.id) : newId();
      if (seen.has(id)) id = newId();
      seen.add(id);
      return { id, title: String(c.title ?? ''), body: String(c.body ?? ''), updatedAt: now };
    });
    state.currentId = state.chapters[0].id;
    state.carets = {};
    for (const id of oldIds) if (!seen.has(id)) markPending(id);
    state.chapters.forEach(c => markPending(c.id));
    touchMeta();
    countCache.clear();
    renderAll(false);
    toast('バックアップから復元しました');
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg, actLabel, actFn) {
    const t = $('#toast'), act = $('#toastAct');
    $('#toastMsg').textContent = msg;
    act.hidden = !actLabel;
    act.textContent = actLabel || '';
    act.onclick = actLabel ? () => { t.hidden = true; actFn(); } : null;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, actLabel ? 7000 : 2800);
  }

  // ---------- keyboard ----------
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === 's') { e.preventDefault(); saveLocalNow(); flush(); toast('保存しました'); }
    else if (mod && k === 'f') { e.preventDefault(); openFind(); }
    else if ((mod && k === 'g') || e.key === 'F3') { e.preventDefault(); if (findbar.hidden) openFind(); else findStep(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape' && !e.isComposing) {
      if (openPop) { const b = openPop.btn; closePop(); b.focus(); }
      else if (drawerOpen()) { setDrawer(false); $('#btnDrawer').focus(); }
      else if (!findbar.hidden) closeFind();
      else if (panel) openPanel(null);
      else return;
      e.preventDefault();
    }
  });

  window.addEventListener('beforeunload', () => { saveLocalNow(); flush(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveLocalNow(); flush(); } });

  setView('edit');
  renderAll(true);
  updateSaveState();
  initCloud();
})();
</script>
</body>
</html>
