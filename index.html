<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>原稿帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Shippori+Mincho+B1:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one slim bar on top, the manuscript fills everything else; the outline slides in from the left, tools open on the right only when asked */
:root {
  --sheet: #fcfcfb;
  --paper: #f3f5f8;
  --hover: #eaeef4;
  --ink: #1c2233;
  --ink-soft: #5d6679;
  --rule: #dde2ea;
  --ai: #27457f;
  --ai-soft: #e2e8f4;
  --shu: #b6412a;
  --shu-soft: #f6e4de;
  --ok: #2c7a55;
  --f-body: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
  --f-ui: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  --f-display: "Shippori Mincho B1", "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-text: var(--f-body);
  --f-head: var(--f-display);
  --fs: 18px;
  --lh: 1.9;
  --line-chars: 40;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sheet: #15181f; --paper: #1b1f28; --hover: #252a36; --ink: #e5e2da; --ink-soft: #9ca3b3;
    --rule: #2c3240; --ai: #9bb2e4; --ai-soft: #26304a; --shu: #e47c62; --shu-soft: #3b2621; --ok: #79c6a1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sheet: #15181f; --paper: #1b1f28; --hover: #252a36; --ink: #e5e2da; --ink-soft: #9ca3b3;
  --rule: #2c3240; --ai: #9bb2e4; --ai-soft: #26304a; --shu: #e47c62; --shu-soft: #3b2621; --ok: #79c6a1;
  color-scheme: dark;
}

html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--sheet); color: var(--ink);
  font-family: var(--f-ui); font-size: 14px; line-height: 1.6;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { overscroll-behavior: none; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
svg { display: block; }

#app {
  position: relative; height: 100%;
  display: grid; grid-template-rows: auto auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#bar { grid-row: 1; }
#findbar { grid-row: 2; }
.main { grid-row: 3; }

/* ---------- the one bar ---------- */
.bar {
  position: relative; z-index: 20;
  display: grid; align-items: center; gap: 4px 10px;
  grid-template-columns: auto minmax(120px, 1fr) auto auto;
  grid-template-areas: "drawer title tools end";
  padding-block: 6px; border-bottom: 1px solid var(--rule);
  transition: opacity 0.35s ease;
}
body.typing .bar { opacity: 0.3; }
body.typing .bar:hover, body.typing .bar:focus-within { opacity: 1; }
#btnDrawer { grid-area: drawer; }
.crumb {
  grid-area: title; min-width: 0; height: 34px; display: flex; align-items: center; gap: 6px;
  padding: 0 8px; border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  font-family: var(--f-display); font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-align: left;
}
.crumb:hover { background: var(--hover); }
.crumb-part { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.crumb-sep { flex: none; color: var(--ink-soft); font-family: var(--f-ui); }
.crumb-title { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; }
.bar-tools { grid-area: tools; min-width: 0; display: flex; align-items: center; gap: 4px; }
.bar-end { grid-area: end; position: relative; display: flex; align-items: center; gap: 2px; }
.sep { flex: none; width: 1px; height: 18px; background: var(--rule); margin: 0 4px; }

.tbtn {
  flex: none; display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 10px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.tbtn:hover { background: var(--hover); }
.tbtn[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); font-weight: 500; }
.tbtn:disabled { opacity: 0.35; cursor: default; background: transparent; }
.tbtn.glyph { font-family: var(--f-body); font-size: 14px; }
.tbtn svg { width: 16px; height: 16px; }
.level-btn { min-width: 6.4em; justify-content: space-between; background: var(--hover); font-weight: 500; }
.level-btn:hover { background: var(--ai-soft); }
.level-btn svg { width: 12px; height: 12px; color: var(--ink-soft); }
.icon {
  flex: none; display: inline-grid; place-items: center; width: 34px; height: 34px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); cursor: pointer;
}
.icon:hover { background: var(--hover); color: var(--ink); }
.icon[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); }
.icon svg { width: 20px; height: 20px; }
.seg { flex: none; display: inline-flex; padding: 2px; border-radius: 8px; background: var(--hover); }
.seg .tbtn { height: 28px; padding: 0 10px; }
.seg .tbtn[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 1px 2px rgb(10 20 40 / 0.14); }

.count {
  display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px;
  border: 0; border-radius: 6px; background: transparent; cursor: pointer;
  font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap;
}
.count:hover { background: var(--hover); }
.count b { color: var(--ink); font-size: 14px; font-weight: 500; }
.cnt-sel { color: var(--ai); }
.cnt-sel b { color: var(--ai); }
.save { display: inline-flex; align-items: center; gap: 5px; }
.save .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save.busy .dot { background: var(--ink-soft); }
.save.warn { color: var(--shu); }
.save.warn .dot { background: var(--shu); }

.goal-line { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; }
.goal-line i { display: block; height: 100%; width: 0; background: var(--ai); opacity: 0.55; transition: width 0.3s ease; }
.goal-line.done i { background: var(--ok); opacity: 0.8; }

/* ---------- popovers ---------- */
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30;
  min-width: 220px; max-width: calc(100vw - 32px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: 0 14px 36px -14px rgb(10 20 40 / 0.4); padding: 6px;
}
.menu button {
  display: flex; justify-content: space-between; align-items: center; gap: 16px; width: 100%;
  padding: 9px 10px; border: 0; border-radius: 6px; background: transparent; text-align: left;
  font-size: 13px; cursor: pointer;
}
.menu button:hover { background: var(--hover); }
.menu kbd { font-family: var(--f-ui); font-size: 11px; color: var(--ink-soft); }
.levels { right: auto; width: 250px; z-index: 32; }
.levels button[aria-checked="true"] { background: var(--ai-soft); }
.lv-sample { font-family: var(--f-head); font-weight: 700; line-height: 1.3; }
.lv-sample.l1 { font-size: 21px; }
.lv-sample.l2 { font-size: 17px; }
.lv-sample.l3 { font-size: 14.5px; }
.lv-sample.l0 { font-family: var(--f-text); font-weight: 400; font-size: 13px; }
.levels .muted { padding: 6px 10px 4px; border-top: 1px solid var(--rule); margin-top: 4px; }
.stats { width: 280px; padding: 14px; display: flex; flex-direction: column; gap: 12px; font-variant-numeric: tabular-nums; }
.stat { display: flex; flex-direction: column; gap: 1px; }
.stat-label { font-size: 11px; letter-spacing: 0.06em; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat-main { font-size: 13px; }
.stat-main b { font-size: 20px; font-weight: 500; }
.stat-sub { font-size: 12px; color: var(--ink-soft); }
.goal-set { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft); }
.goal-set input { width: 90px; height: 28px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.goal-bar { height: 4px; border-radius: 2px; background: var(--rule); overflow: hidden; }
.goal-bar i { display: block; height: 100%; width: 0; background: var(--ai); }
.goal-bar.done i { background: var(--ok); }
.save-detail { margin: 0; font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 10px; }

/* ---------- find bar ---------- */
.findbar { display: flex; flex-direction: column; gap: 6px; padding-block: 8px; border-bottom: 1px solid var(--rule); }
.find-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.find-row input {
  flex: 1 1 200px; min-width: 0; max-width: 340px; height: 32px; padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
}
.find-row input:focus { outline: none; border-color: var(--ai); }
.find-count {
  flex: none; display: inline-flex; align-items: center; gap: 4px; min-width: 4.5em; height: 30px; padding: 0 8px;
  border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); cursor: pointer;
  font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.find-count:hover { background: var(--hover); color: var(--ink); }
.find-count[aria-pressed="true"] { background: var(--ai-soft); color: var(--ai); }
.find-count svg { width: 15px; height: 15px; flex: none; }
.find-row:first-child { flex-wrap: nowrap; }
.find-row:first-child input { min-width: 80px; }
.find-field { position: relative; flex: 1 1 220px; min-width: 0; max-width: 360px; display: flex; }
.find-field input { flex: 1; min-width: 0; max-width: none; padding-left: 30px; }
.find-field svg { position: absolute; left: 9px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--ink-soft); pointer-events: none; }
.find-field .mode-ai { color: var(--ai); }
.findbar:not(.ai) .mode-ai, .findbar.ai .mode-find { display: none; }
.findbar.ai #findQ { border-color: var(--ai); }
.find-more { position: relative; flex: none; }
#findMenu { right: 0; top: calc(100% + 6px); min-width: 200px; z-index: 31; }
.menu .mark { visibility: hidden; color: var(--ai); }
.menu [aria-checked="true"] .mark { visibility: visible; }
.chip {
  flex: none; display: inline-flex; align-items: center; height: 26px; padding: 0 10px;
  border: 1px solid var(--rule); border-radius: 999px; background: transparent; color: var(--ai);
  font-size: 12px; cursor: pointer; white-space: nowrap;
}
.chip:hover { border-color: var(--ai); }
.ai-status { display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 1.5; color: var(--ink-soft); }
.spin { flex: none; width: 12px; height: 12px; border: 2px solid var(--rule); border-top-color: var(--ai); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.find-map { display: block; width: 100%; height: 12px; margin-top: -2px; cursor: pointer; touch-action: none; }
.search-filters { display: flex; flex-wrap: wrap; gap: 8px; }
.search-filters .tbtn { height: 26px; padding: 0 10px; font-size: 12px; }
body.find-ai #talkSeg { display: none; }
.search-list .hits { gap: 5px; }
.search-head { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.search-head span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-head.lv2 span:first-child { padding-left: 0.8em; }
.search-head.lv3 span:first-child { padding-left: 1.6em; }
.search-list .hit .snip mark { background: rgb(232 168 40 / 0.32); color: inherit; }
.hit.is-current { border-color: var(--ai); box-shadow: inset 3px 0 0 var(--ai); }
.hit .why { color: var(--ai); }

/* ---------- writing area ---------- */
.main { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
.stage { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; overflow: hidden; }
.writing {
  margin: 0; border: 0; outline: none; background: transparent; color: var(--ink);
  font-family: var(--f-text); font-size: var(--fs); line-height: var(--lh); font-kerning: none;
  overflow: auto; overscroll-behavior: contain;
}
.vertical .writing {
  writing-mode: vertical-rl; padding: 1.5em 2em;
  width: 100%; height: min(100%, calc(var(--line-chars) * 1em + 3em + 18px));
}
.horizontal .writing {
  writing-mode: horizontal-tb; padding: 2em;
  height: 100%; width: min(100%, calc(var(--line-chars) * 1em + 4em + 18px));
}
.doc { white-space: pre-wrap; overflow-wrap: anywhere; }
.doc p { margin: 0; }
/* Flipped after each change to make WebKit redraw the paragraph (see "redraw" in the script). */
.doc > .rp { outline: 1px solid transparent; }
.doc h1, .doc h2, .doc h3 { margin: 0; margin-block: 1.1em 0.5em; font-family: var(--f-head); font-weight: 700; line-height: 1.45; }
.doc h1 { font-size: 1.6em; }
.doc h2 { font-size: 1.3em; }
.doc h3 { font-size: 1.1em; }
.doc > :first-child { margin-block-start: 0; }
#editor { caret-color: var(--ai); }
#preview rt { font-size: 0.5em; font-family: var(--f-text); font-weight: 400; }
#preview .bouten { font-style: normal; -webkit-text-emphasis: sesame; text-emphasis: sesame; }
#preview .tcy { -webkit-text-combine: horizontal; text-combine-upright: all; }
::highlight(find) { background-color: rgb(232 168 40 / 0.32); }
::highlight(find-current) { background-color: rgb(236 150 20 / 0.85); color: #16130c; }
::highlight(check) { background-color: rgb(214 82 52 / 0.22); }
::highlight(flash) { background-color: rgb(236 150 20 / 0.6); }

.hint {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 6px; width: max-content; max-width: calc(100% - 16px);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 8px;
  padding: 5px 4px 5px 12px; font-size: 12px; color: var(--ink-soft);
  box-shadow: 0 8px 20px -12px rgb(10 20 40 / 0.35);
}
.hint .icon { width: 26px; height: 26px; }
.hint .icon svg { width: 14px; height: 14px; }

/* ---------- side panel (check / settings / file) ---------- */
#panel {
  width: 320px; min-height: 0; overflow: auto; overscroll-behavior: contain;
  border-left: 1px solid var(--rule); padding: 14px 0 14px 16px; margin-left: 12px;
  display: flex; flex-direction: column; gap: 14px;
}
.panel-head { display: flex; justify-content: space-between; align-items: center; }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 700; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field > span { font-size: 12px; color: var(--ink-soft); }
.field select {
  width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
}
.field input[type="range"] { width: 100%; accent-color: var(--ai); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; }
.check input { accent-color: var(--ai); margin-top: 4px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; height: 32px; padding: 0 12px;
  border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
  font-size: 13px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--ai); }
.btn.danger { background: var(--shu); border-color: var(--shu); color: var(--sheet); }
.muted { margin: 0; font-size: 12px; color: var(--ink-soft); }
.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.hit {
  width: 100%; text-align: left; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet);
  padding: 7px 9px; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
}
.hit:hover { border-color: var(--ai); }
.hit .where { font-size: 11px; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .msg { font-size: 12px; }
.hit .snip { font-family: var(--f-body); font-size: 13px; white-space: pre-wrap; word-break: break-all; }
.hit .snip mark { background: var(--shu-soft); color: var(--shu); border-radius: 2px; }
.ok-note { color: var(--ok); font-size: 13px; }
.table { font-size: 12px; border-collapse: collapse; width: 100%; }
.table td { padding: 4px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.table td:first-child { white-space: nowrap; padding-right: 12px; }
.table .mono { font-family: var(--f-body); }
.table kbd { font-family: var(--f-ui); }
.confirm-box { border: 1px solid var(--shu); background: var(--shu-soft); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.note-box { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }

/* ---------- outline drawer ---------- */
.drawer {
  position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(86vw, 320px);
  display: flex; flex-direction: column; gap: 14px; overflow: auto; overscroll-behavior: contain;
  background: var(--paper); border-right: 1px solid var(--rule); box-shadow: 10px 0 30px -18px rgb(10 20 40 / 0.45);
  padding: calc(12px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform: translateX(-104%); visibility: hidden;
  transition: transform 0.22s ease, visibility 0s linear 0.22s;
}
body.drawer-open .drawer { transform: none; visibility: visible; transition: transform 0.22s ease; }
.scrim { position: fixed; inset: 0; z-index: 35; background: rgb(10 14 24 / 0.28); }
.drawer-head { display: flex; align-items: center; gap: 8px; }
.seal {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 4px;
  background: var(--shu); color: var(--sheet); font-family: var(--f-display); font-size: 16px; line-height: 1;
}
.brand { font-family: var(--f-display); font-size: 16px; letter-spacing: 0.08em; flex: 1; }
.work-title {
  width: 100%; height: 36px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--sheet); font-family: var(--f-body); font-size: 15px;
}
.work-title:focus { outline: none; border-color: var(--ai); }
.label { font-size: 11px; letter-spacing: 0.12em; color: var(--ink-soft); font-weight: 500; }
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.toc-item {
  width: 100%; display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  padding: 7px 8px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer;
}
.toc-item:hover { background: var(--hover); }
.toc-item.is-current { background: var(--ai-soft); }
.toc-item.lv2 { padding-left: 22px; }
.toc-item.lv3 { padding-left: 36px; }
.toc-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--f-body); }
.toc-item.lv1 .toc-name { font-size: 14.5px; font-weight: 600; }
.toc-item.lv2 .toc-name { font-size: 13.5px; }
.toc-item.lv3 .toc-name { font-size: 13px; color: var(--ink-soft); }
.toc-count { flex: none; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.toc-empty { font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; margin: 0; }
.work-total { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.work-total b { color: var(--ink); font-size: 15px; font-weight: 500; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--sheet); padding: 8px 14px; border-radius: 8px; font-size: 13px;
}
.toast button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; padding: 2px 4px; }

/* ---------- narrower screens ---------- */
@media (max-width: 820px) {
  .bar { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "drawer title end" "tools tools tools"; }
  .bar-tools { overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .bar-tools::-webkit-scrollbar { display: none; }
}
/* ---------- phones: the tools sit in a second row of the top bar ---------- */
.tool-group { flex: none; display: flex; align-items: center; gap: 4px; }
.tool-edit { gap: 0; margin-left: 2px; padding-left: 4px; border-left: 1px solid var(--rule); }
.icon:disabled { opacity: 0.3; cursor: default; background: transparent; }
body:not(.mobile) .m-only { display: none !important; }
body.mobile .bar { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "drawer title end" "tools tools tools"; }
body.mobile .bar-tools { overflow-x: auto; scrollbar-width: none; }
body.mobile .bar-tools::-webkit-scrollbar { display: none; }
body.mobile .bar-tools .tbtn { padding: 0 7px; }
body.mobile .bar-tools .icon { width: 36px; }
body.mobile .bar-tools .sep { display: none; }
/* Undo, redo and the keyboard button stay in view even when the row scrolls on narrow phones. */
body.mobile .tool-edit { position: sticky; right: 0; z-index: 1; margin-left: auto; background: var(--sheet); }
body.mobile .level-btn { min-width: 0; gap: 3px; }
.cnt-genko, .save-text { display: none; }
.save.warn .save-text { display: inline; }
body.mobile .crumb-part:not(:last-child), body.mobile .crumb-sep { display: none; }
body.mobile .main { grid-template-columns: minmax(0, 1fr); }
body.mobile .vertical .writing { padding: 1em; height: min(100%, calc(var(--line-chars) * 1em + 2em + 18px)); }
body.mobile .horizontal .writing { padding: 1.2em 0.3em; width: 100%; }
/* While writing on a phone the text area stays above the keyboard. */
body.mobile.kb .stage { align-items: flex-start; }
body.mobile.kb .vertical .writing { height: min(var(--edit-h, 100%), calc(var(--line-chars) * 1em + 2em + 18px)); }
body.mobile.kb .horizontal .writing { height: var(--edit-h, 100%); }
body.mobile.kb .hint { display: none; }
.kb-grip {
  position: absolute; z-index: 4; left: 50%; width: 96px; height: 24px; margin-left: -48px;
  touch-action: none; cursor: ns-resize; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.kb-grip::before { content: ""; position: absolute; left: 30px; right: 30px; top: 10px; height: 4px; border-radius: 2px; background: var(--ink-soft); opacity: 0.45; }
body.mobile .find-row { gap: 4px; }
body.mobile .find-row input { flex-basis: 110px; max-width: none; }
body.mobile .find-row .tbtn { padding: 0 8px; }
body.mobile .find-count { min-width: 0; padding: 0 6px; font-size: 11px; }
body.mobile .findbar .icon { width: 36px; }
@media (max-width: 350px) { body.mobile .findbar .icon { width: 30px; } body.mobile .find-field input { padding-left: 26px; } }
body.mobile #panel {
  position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; width: auto; max-height: 62%; margin: 0;
  border-left: 0; border-top: 1px solid var(--rule); border-radius: 12px 12px 0 0;
  background: var(--paper); box-shadow: 0 -10px 30px -14px rgb(10 20 40 / 0.4);
  padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet-handle { display: none; }
body.mobile .sheet-handle { display: block; position: relative; flex: none; align-self: center; width: 56px; height: 20px; margin: -10px 0 -8px; border: 0; background: transparent; cursor: pointer; }
body.mobile .sheet-handle::before { content: ""; position: absolute; left: 10px; right: 10px; top: 8px; height: 4px; border-radius: 2px; background: var(--rule); }
/* Messages show near the top on phones, where the keyboard cannot hide them. */
body.mobile .toast { top: calc(104px + env(safe-area-inset-top, 0px)); bottom: auto; }

.exit-preview {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 6;
  height: 40px; padding: 0 18px; border: 1px solid var(--rule); border-radius: 999px;
  background: var(--paper); color: var(--ai); font-size: 14px; font-weight: 500; cursor: pointer;
  box-shadow: 0 8px 20px -12px rgb(10 20 40 / 0.35);
}

/* The cursor drawn for vertical writing on iPhone (the system one is drawn sideways there). */
body.ios-vcaret #editor { caret-color: transparent; }
.fake-caret { position: absolute; z-index: 5; height: 2px; border-radius: 1px; background: var(--ai); pointer-events: none; animation: caret-blink 1.1s steps(1) infinite; }
@keyframes caret-blink { 50% { opacity: 0; } }

@media (pointer: coarse) {
  input, select, textarea, .work-title, .find-row input, .goal-set input, .field select { font-size: 16px; }
  .tbtn { height: 40px; }
  .seg .tbtn { height: 34px; padding: 0 12px; }
  .icon { width: 42px; height: 42px; }
  .count, .crumb { height: 42px; }
  .menu button { padding: 12px; font-size: 14px; }
  .toc-item { padding-block: 11px; }
  .hit { padding: 10px 12px; }
  .btn { height: 40px; }
  .field select, .find-row input, .work-title { height: 42px; }
  .goal-set input { width: 110px; height: 36px; }
  .field input[type="range"] { height: 32px; }
  .check { padding-block: 4px; }
  .levels kbd { display: none; }
  .chip { height: 32px; padding: 0 12px; font-size: 13px; }
  .search-filters .tbtn { height: 32px; }
  .tbtn:active, .icon:active, .count:active, .crumb:active, .toc-item:active, .menu button:active, .hit:active, .btn:active { background: var(--ai-soft); }
}
@media (prefers-reduced-motion: reduce) {
  .drawer, body.drawer-open .drawer, .bar, .goal-line i { transition: none; }
  .fake-caret { animation: none; }
  .spin { animation: none; }
}
</style>
</head>
<body>
<div id="app" lang="ja">
  <header class="bar" id="bar">
    <button type="button" class="icon" id="btnDrawer" aria-label="目次" aria-expanded="false" title="目次（見出しから自動で作られます）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button type="button" class="crumb" id="crumb" title="目次を開く"></button>
    <div class="bar-tools" id="barTools" role="toolbar" aria-label="執筆ツール">
      <div class="tool-group" id="toolInput">
        <button type="button" class="tbtn level-btn" id="btnLevel" aria-haspopup="menu" aria-expanded="false" title="段落の種類（見出しにすると目次に章として並びます）">
          <span id="levelLabel">本文</span>
          <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
        </button>
        <span class="sep" aria-hidden="true"></span>
        <button type="button" class="tbtn" data-ins="ruby" title="ルビ：文字を選んでから押す。漢字の直後なら、そのまま押して読みを入力">ルビ</button>
        <button type="button" class="tbtn" data-ins="bouten" title="傍点：文字を選んでから押す">傍点</button>
        <button type="button" class="tbtn glyph" data-ins="dash" title="ダッシュ（――）" aria-label="ダッシュを入力">――</button>
        <button type="button" class="tbtn glyph" data-ins="leader" title="三点リーダー（……）" aria-label="三点リーダーを入力">……</button>
      </div>
      <div class="tool-group tool-edit m-only" id="toolEdit">
        <button type="button" class="icon" id="btnUndo" data-keep aria-label="元に戻す" title="元に戻す" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6 5 10l4 4"/><path d="M5 10h9.5a4.5 4.5 0 0 1 0 9H12"/></svg>
        </button>
        <button type="button" class="icon" id="btnRedo" data-keep aria-label="やり直す" title="やり直す" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6 4 4-4 4"/><path d="M19 10H9.5a4.5 4.5 0 0 0 0 9H12"/></svg>
        </button>
        <button type="button" class="icon" id="btnKbClose" data-keep aria-label="キーボードを閉じる" title="キーボードを閉じる" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="11" rx="2"/><path d="M7 8h.01M11 8h.01M15 8h.01M8 11.5h8"/><path d="m9 18.5 3 2.5 3-2.5"/></svg>
        </button>
      </div>
    </div>
    <div class="bar-end">
      <button type="button" class="count" id="btnStats" aria-haspopup="dialog" aria-expanded="false" title="文字数・目標・保存先">
        <span class="cnt-sel" id="cntSel" hidden>選択 <b id="cntSelN">0</b> /</span>
        <span><b id="cntChars">0</b> 字</span>
        <span class="cnt-genko"><span id="cntGenko">0</span>枚</span>
        <span class="save" id="saveState"><i class="dot"></i><span class="save-text" id="saveText">保存済み</span></span>
      </button>
      <button type="button" class="icon" id="btnFind" aria-pressed="false" title="検索・置換（Ctrl+F）" aria-label="検索・置換">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
      </button>
      <button type="button" class="icon" id="btnMenu" aria-label="メニュー" aria-haspopup="menu" aria-expanded="false" title="メニュー">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
      </button>

      <div class="pop stats" id="statsPop" role="dialog" aria-label="文字数と目標" hidden>
        <div class="stat">
          <span class="stat-label" id="stSecLabel">この章</span>
          <span class="stat-main"><b id="stChars">0</b> 字</span>
          <span class="stat-sub">原稿用紙（400字詰め）約 <span id="stGenko">0</span> 枚</span>
        </div>
        <div class="stat">
          <span class="stat-label">作品全体</span>
          <span class="stat-main"><b id="stTotal">0</b> 字</span>
          <span class="stat-sub">原稿用紙 約 <span id="stTotalGenko">0</span> 枚 ・ 見出しは数えません</span>
        </div>
        <label class="goal-set">1章の目標 <input type="number" id="targetInput" min="0" step="500" inputmode="numeric" enterkeyhint="done"> 字</label>
        <div class="goal-bar" id="goalBar"><i id="goalFill"></i></div>
        <span class="stat-sub" id="goalText"></span>
        <p class="save-detail" id="saveDetail"></p>
      </div>

      <div class="pop menu" id="menuPop" role="menu" hidden>
        <button type="button" role="menuitem" id="mnuDirection"><span id="mnuDirectionLabel">横書きにする</span></button>
        <button type="button" role="menuitem" id="mnuPreview"><span id="mnuPreviewLabel">プレビュー（ルビを表示）</span></button>
        <button type="button" role="menuitem" data-open="check"><span>表記チェック</span></button>
        <button type="button" role="menuitem" data-open="settings"><span>表示設定</span></button>
        <button type="button" role="menuitem" data-open="file"><span>書き出し・読み込み</span></button>
        <button type="button" role="menuitem" id="btnFull"><span id="fullLabel">全画面表示</span></button>
      </div>
    </div>

    <div class="goal-line" id="goalLine" aria-hidden="true"><i id="goalLineFill"></i></div>
  </header>

  <div class="findbar" id="findbar" hidden>
    <div class="find-row">
      <label class="find-field">
        <svg class="mode-find" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <svg class="mode-ai" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9zM19 15l.9 2.1 2.1.9-2.1.9L19 21l-.9-2.1-2.1-.9 2.1-.9z"/></svg>
        <input type="search" id="findQ" placeholder="検索" aria-label="検索する文字" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
      </label>
      <button type="button" class="find-count" id="btnFindList" aria-pressed="false" title="見つかった箇所を一覧する">
        <span id="findCount" aria-live="polite"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>
      </button>
      <button type="button" class="icon" id="findPrev" aria-label="前へ" title="前へ（Shift+Enter）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <button type="button" class="icon" id="findNext" aria-label="次へ" title="次へ（Enter）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div class="find-more">
        <button type="button" class="icon" id="btnFindMore" data-keep aria-label="ほかの探し方" aria-haspopup="menu" aria-expanded="false" title="内容で探す（AI）・置換">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg>
        </button>
        <div class="pop menu" id="findMenu" role="menu" hidden>
          <button type="button" role="menuitemcheckbox" id="optAi" data-keep aria-checked="false" hidden><span>内容で探す（AI）</span><span class="mark" aria-hidden="true">✓</span></button>
          <button type="button" role="menuitemcheckbox" id="btnReplace" data-keep aria-checked="false"><span>置換</span><span class="mark" aria-hidden="true">✓</span></button>
        </div>
      </div>
      <button type="button" class="icon" id="findClose" aria-label="検索を閉じる" title="閉じる（Esc）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="find-row" id="replRow" hidden>
      <input type="text" id="replQ" placeholder="置き換える文字" aria-label="置き換える文字" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
      <button type="button" class="tbtn" id="replOne">置換して次へ</button>
      <button type="button" class="tbtn" id="replAll">すべて置換</button>
    </div>
    <div class="ai-status" id="aiStatus" hidden><span class="spin" id="aiSpin" hidden></span><span id="aiMsg"></span><button type="button" class="chip" id="aiStop" hidden>止める</button><button type="button" class="chip" id="aiTry" hidden>AIで内容から探す</button></div>
    <canvas class="find-map" id="findMap" title="原稿のどこにあるか（押すと近くの箇所へ）" hidden></canvas>
  </div>

  <div class="main">
    <div class="stage vertical" id="stage">
      <div id="editor" class="writing doc" contenteditable="true" spellcheck="false" role="textbox" aria-multiline="true" aria-label="本文" autocapitalize="off" autocorrect="off" translate="no"></div>
      <div id="preview" class="writing doc" hidden tabindex="0" aria-label="プレビュー"></div>
      <div id="fakeCaret" class="fake-caret" aria-hidden="true" hidden></div>
      <div id="kbGrip" class="kb-grip" title="ドラッグしてキーボードの上に合わせる" aria-hidden="true" hidden></div>
      <button type="button" class="exit-preview" id="btnExitPreview" hidden>プレビューを終了</button>
      <div class="hint" id="sampleHint" hidden>
        <span>見本の原稿です。行を選んでバーの「本文」を「大見出し」などに変えると、☰ の目次に章として並びます。</span>
        <button type="button" class="icon" id="hintClose" aria-label="案内を閉じる">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
    <aside id="panel" hidden></aside>
  </div>

  <div class="pop menu levels" id="levelPop" role="menu" aria-label="段落の種類" hidden>
    <button type="button" role="menuitemradio" data-level="1" aria-checked="false"><span class="lv-sample l1">大見出し</span><kbd>Ctrl+Alt+1</kbd></button>
    <button type="button" role="menuitemradio" data-level="2" aria-checked="false"><span class="lv-sample l2">中見出し</span><kbd>Ctrl+Alt+2</kbd></button>
    <button type="button" role="menuitemradio" data-level="3" aria-checked="false"><span class="lv-sample l3">小見出し</span><kbd>Ctrl+Alt+3</kbd></button>
    <button type="button" role="menuitemradio" data-level="0" aria-checked="true"><span class="lv-sample l0">本文</span><kbd>Ctrl+Alt+0</kbd></button>
    <p class="muted">見出しは ☰ の目次に章として並びます。行頭で「# 」と打っても見出しになります。</p>
  </div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="作品と目次">
    <div class="drawer-head">
      <span class="seal" aria-hidden="true">稿</span><span class="brand">原稿帳</span>
      <button type="button" class="icon" id="drawerClose" aria-label="目次を閉じる">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <input id="workTitle" class="work-title" type="text" aria-label="作品タイトル" placeholder="作品タイトル" autocomplete="off" enterkeyhint="done">
    <div class="label">目次</div>
    <ol class="toc" id="toc"></ol>
    <p class="toc-empty" id="tocEmpty" hidden>見出しはまだありません。行を選んでバーの「本文」を「大見出し」「中見出し」「小見出し」に変えると、ここに章として並びます。</p>
    <div class="work-total">作品全体 <b id="workChars">0</b> 字 ・ 原稿用紙 約<span id="workGenko">0</span>枚</div>
  </aside>

  <div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button type="button" id="toastAct" hidden></button></div>
</div>

<template id="tpl-check">
  <div class="panel-head"><h2>表記チェック</h2><button type="button" class="icon" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <p class="muted">小説原稿の一般的な決まりごとに沿っているかを本文で確かめます。該当箇所は本文に色が付きます。項目を押すとその場所へ移動します。</p>
  <ul class="hits" id="checkList"></ul>
</template>

<template id="tpl-search">
  <div class="panel-head"><h2>検索結果</h2><button type="button" class="icon" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="search-filters" id="searchFilters">
    <div class="seg" role="group" aria-label="探す範囲"><button type="button" class="tbtn" data-scope="0">原稿全体</button><button type="button" class="tbtn" data-scope="1">この章</button></div>
    <div class="seg" role="group" aria-label="会話と地の文" id="talkSeg"><button type="button" class="tbtn" data-talk="0">すべて</button><button type="button" class="tbtn" data-talk="1">会話</button><button type="button" class="tbtn" data-talk="2">地の文</button></div>
  </div>
  <p class="muted" id="searchSummary"></p>
  <div class="search-list" id="searchList"></div>
</template>

<template id="tpl-settings">
  <div class="panel-head"><h2>表示設定</h2><button type="button" class="icon" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <label class="field"><span>書体</span>
    <select id="setFont"><option value="mincho">明朝体</option><option value="gothic">ゴシック体</option></select>
  </label>
  <label class="field"><span>文字の大きさ <b id="setFsV"></b></span><input type="range" id="setFs" min="13" max="30" step="1"></label>
  <label class="field"><span>行間 <b id="setLhV"></b></span><input type="range" id="setLh" min="1.4" max="2.6" step="0.1"></label>
  <label class="field"><span>1行の字数（画面に収まらないときは画面に合わせます） <b id="setLcV"></b></span><input type="range" id="setLc" min="15" max="60" step="1"></label>
  <label class="check"><input type="checkbox" id="setIndent"><span>改行したら段落頭を自動で字下げする<br><span class="muted">かぎかっこで始まる段落は字下げしません。</span></span></label>
  <label class="check"><input type="checkbox" id="setDim"><span>入力中は上のバーを薄くする（マウスを動かすと戻ります）</span></label>
  <label class="check"><input type="checkbox" id="setTcy"><span>縦書きプレビューで半角数字・「!?」を縦中横にする</span></label>
  <div class="field"><span>記法</span>
    <table class="table">
      <tr><td class="mono">｜親文字《おやもじ》</td><td>ルビ</td></tr>
      <tr><td class="mono">漢字《かんじ》</td><td>漢字だけなら「｜」は省略可</td></tr>
      <tr><td class="mono">《《傍点》》</td><td>傍点</td></tr>
      <tr><td class="mono">｜《</td><td>「《」をそのまま表示</td></tr>
      <tr><td class="mono"># 見出し</td><td>行頭で打つと大見出し（## 中・### 小）</td></tr>
    </table>
  </div>
  <div class="field"><span>キー操作</span>
    <table class="table">

    if (!p.ins && !d.ins) return d.start + d.del.length === p.start || d.start === p.start;
    return false;
  }
  function commit(kind, before) {
    const md = toMd(blocks);
    if (md === hist.lastMd) return false;
    const d = diffStr(hist.lastMd, md);
    const now = Date.now();
    const after = getSel() || lastSel;
    const top = hist.undo[hist.undo.length - 1];
    if ((kind === 'typing' || kind === 'delete') && top && top.kind === kind && now - hist.lastTime < 1500 && top.steps.length < 300 && adjacent(top.steps[top.steps.length - 1], d)) {
      top.steps.push(d);
      top.after = after;
    } else {
      hist.undo.push({ kind, steps: [d], before: before || lastSel, after });
      if (hist.undo.length > 300) hist.undo.shift();
    }
    hist.redo.length = 0;
    hist.lastMd = md;
    hist.lastTime = now;
    state.md = md;
    touch();
    updateUndoButtons();
    return true;
  }
  function updateUndoButtons() {
    $('#btnUndo').disabled = !hist.undo.length;
    $('#btnRedo').disabled = !hist.redo.length;
  }
  function restore(md, sel) {
    blocks = fromMd(md);
    renderEditor();
    hist.lastMd = toMd(blocks);
    hist.lastTime = 0;
    state.md = hist.lastMd;
    indentEl = null;
    touch();
    if (viewMode !== 'edit') setView('edit');
    const s = sel || lastSel;
    // On a phone, undoing from the toolbar while reading should not pop up the keyboard.
    if (!isTouch || document.activeElement === editor) setSel(s.start, s.end);
    else reveal(s.start, s.end, false);
    contentChanged();
    updateUndoButtons();
  }
  function undo() {
    const g = hist.undo.pop();
    if (!g) return;
    let md = hist.lastMd;
    for (let j = g.steps.length - 1; j >= 0; j--) { const d = g.steps[j]; md = md.slice(0, d.start) + d.del + md.slice(d.start + d.ins.length); }
    hist.redo.push(g);
    restore(md, g.before);
  }
  function redo() {
    const g = hist.redo.pop();
    if (!g) return;
    let md = hist.lastMd;
    for (const d of g.steps) md = md.slice(0, d.start) + d.ins + md.slice(d.start + d.del.length);
    hist.undo.push(g);
    restore(md, g.after);
  }

  function touch() {
    state.updatedAt = Date.now();
    state.dirty = true;
    state.pristine = false;
    saveLocalSoon();
    scheduleSync();
    renderHint();
  }

  // ---------- editing ----------
  let composing = false;
  let indentEl = null;
  let findArmed = false;

  function contentChanged() {
    scheduleStats();
    scheduleCaretUi();
    if (!findbar.hidden) scheduleFind();
    if (panel === 'check') scheduleCheck();
    if (state.settings.dimWhileTyping && !isTouch && document.activeElement === editor) document.body.classList.add('typing');
  }

  // Replace [start, end) with text; "\n" splits paragraphs. With markdown, lines like "# 見出し" become
  // headings, and a heading never merges into the paragraph around the caret.
  function applyEdit(start, end, text, { markdown = false, caret = null, kind = 'insert', before = null, focus = true, select = true } = {}) {
    const sel0 = before || getSel() || lastSel;
    const a = locate(start), z = locate(end);
    const first = blocks[a.i], last = blocks[z.i];
    const head = first.text.slice(0, a.k), tail = last.text.slice(z.k);
    const lines = text.split('\n');
    const parsed = lines.map(l => (markdown ? parseLine(l) : { level: 0, text: l }));
    const nb = [];
    let ci, ck;
    if (lines.length === 1) {
      const p = parsed[0];
      if (!head && !tail) nb.push({ level: p.level || first.level, text: p.text });
      else nb.push({ level: first.level, text: head + (p.level ? lines[0] : p.text) + tail });
      ci = 0;
      ck = nb[0].text.length - tail.length;
    } else {
      const p0 = parsed[0], pl = parsed[parsed.length - 1];
      if (head && p0.level) nb.push({ level: first.level, text: head }, p0);
      else nb.push(head ? { level: first.level, text: head + p0.text } : p0);
      for (let j = 1; j < parsed.length - 1; j++) nb.push(parsed[j]);
      if (!tail) nb.push(pl);
      else if (!head || pl.level) nb.push(pl, { level: last.level, text: tail });
      else nb.push({ level: last.level, text: pl.text + tail });
      ci = tail && (!head || pl.level) ? nb.length - 2 : nb.length - 1;
      ck = nb[ci].text.length - (ci === nb.length - 1 ? tail.length : 0);
    }
    if (a.i === z.i && nb.length === 1 && nb[0].level === first.level) {
      // Inside one paragraph: change its text and keep the element (keeps the iPhone keyboard steady).
      setBlockText(editor.children[a.i], nb[0].text);
      blocks[a.i] = { level: nb[0].level, text: nb[0].text };
      recompute();
    } else patchBlocks(a.i, z.i - a.i + 1, nb);
    const pos = caret != null ? caret : starts[a.i + ci] + ck;
    indentEl = null;
    if (select) setSel(pos, pos, { focus });
    else { lastSel = { start: pos, end: pos }; scrollToRange(rangeAt(pos, pos)); }
    commit(kind, sel0);
    contentChanged();
  }

  // With the caret right before the 》 of a ruby or 傍点 still being typed, step past the closing marks.
  function exitBrackets(s) {
    if (!s || s.start !== s.end) return false;
    const { i, k } = locate(s.start);
    const t = blocks[i].text;
    if (t[k] !== '》') return false;
    const open = t.lastIndexOf('《', k - 1), close = k > 0 ? t.lastIndexOf('》', k - 1) : -1;
    if (open < 0 || open < close) return false;
    let j = k;
    while (j < t.length && t[j] === '》' && j - k < 2) j++;
    setSel(starts[i] + j);
    return true;
  }

  function handleEnter(lineBreak) {
    const s = getSel();
    if (!s) return;
    if (!lineBreak && exitBrackets(s)) return;
    if (s.end > s.start) applyEdit(s.start, s.end, '', { kind: 'delete', before: s });
    const { i, k } = locate(s.start);
    const b = blocks[i], el = editor.children[i];
    const head = b.text.slice(0, k), tail = b.text.slice(k);
    // The paragraph keeps its element; only its text changes and a new one is added next to it.
    if (b.level > 0 && !head && tail) {
      // At the start of a heading: open a blank line above it.
      el.before(makeBlock(0, ''));
      blocks.splice(i, 0, { level: 0, text: '' });
      recompute();
      indentEl = null;
      setSel(starts[i + 1]);
      commit('enter', s);
      contentChanged();
      return;
    }
    const botLevel = b.level > 0 && tail ? b.level : 0;
    let top = head, bot = tail, ck = 0;
    if (botLevel === 0 && !lineBreak && state.settings.autoIndent) {
      if (b.level === 0 && head === '　' && !tail) top = '';
      if (!/^[　 ]/.test(tail) && !(tail && OPEN_BRACKETS.includes(tail[0]))) { bot = '　' + tail; ck = 1; }
    }
    if (top !== b.text) setBlockText(el, top);
    const nel = makeBlock(botLevel, bot);
    el.after(nel);
    blocks.splice(i, 1, { level: b.level, text: top }, { level: botLevel, text: bot });
    recompute();
    indentEl = ck ? nel : null;
    setSel(starts[i + 1] + ck);
    commit('enter', s);
    contentChanged();
  }

  function setLevel(level) {
    if (viewMode !== 'edit') setView('edit');
    const s = getSel() || lastSel;
    const a = locate(s.start), z = locate(s.end);
    const nb = [], shift = [];
    let changed = false;
    for (let i = a.i; i <= z.i; i++) {
      const b = blocks[i];
      let t = b.text, d = 0;
      if (level > 0 && b.level === 0) { const m = /^[　 ]+/.exec(t); if (m) { t = t.slice(m[0].length); d = -m[0].length; } }
      else if (level === 0 && b.level > 0 && state.settings.autoIndent && t && !/^[　 ]/.test(t) && !OPEN_BRACKETS.includes(t[0])) { t = '　' + t; d = 1; }
      if (t !== b.text || level !== b.level) changed = true;
      nb.push({ level, text: t });
      shift.push(d);
    }
    if (!changed) { closePop(); return; }
    patchBlocks(a.i, z.i - a.i + 1, nb);
    const mapK = (p, d) => (d < 0 ? Math.max(0, p.k + d) : p.k + d);
    setSel(starts[a.i] + mapK(a, shift[0]), starts[z.i] + mapK(z, shift[shift.length - 1]), { scroll: false });
    indentEl = null;
    commit('format', s);
    contentChanged();
    updateCaretUi();
  }

  function fixBracketIndent() {
    if (!indentEl) return;
    if (!indentEl.isConnected) { indentEl = null; return; }
    const i = Array.prototype.indexOf.call(editor.children, indentEl);
    const t = blocks[i] ? blocks[i].text : '';
    if (t === '　') return;
    const el = indentEl;
    indentEl = null;
    if (blocks[i] && blocks[i].level === 0 && t[0] === '　' && t.length >= 2 && OPEN_BRACKETS.includes(t[1])) {
      // Remove the indent from the text itself; the browser keeps the caret where it was.
      const at = charAt(el, 0);
      if (!at) return;
      at[0].deleteData(at[1], 1);
      blocks[i] = { level: 0, text: t.slice(1) };
      recompute();
      const s = getSel();
      if (s) lastSel = s;
    }
  }
  function headingShortcut() {
    const s = getSel();
    if (!s || s.start !== s.end) return false;
    const { i, k } = locate(s.start);
    const b = blocks[i];
    if (b.level) return false;
    const m = /^[　 ]?(#{1,3}) /.exec(b.text);
    if (!m || k !== m[0].length) return false;
    patchBlocks(i, 1, [{ level: m[1].length, text: b.text.slice(m[0].length) }]);
    setSel(starts[i], starts[i], { scroll: false });
    indentEl = null;
    return true;
  }
  // Some mobile browsers do not let a page take over the Enter key. When the browser split the
  // paragraph itself, give the new paragraph the same treatment our own Enter gives it.
  function fixNativeEnter() {
    const s = getSel();
    if (!s) return;
    const { i, k } = locate(s.start);
    const b = blocks[i], prev = blocks[i - 1];
    if (!prev || k !== 0) return;
    let level = b.level, text = b.text;
    if (level && level === prev.level && prev.text && !text) level = 0;
    let ck = 0;
    if (!level && state.settings.autoIndent && !/^[　 ]/.test(text) && !(text && OPEN_BRACKETS.includes(text[0]))) { text = '　' + text; ck = 1; }
    if (level === b.level && text === b.text) return;
    patchBlocks(i, 1, [{ level, text }]);
    indentEl = ck ? editor.children[i] : null;
    setSel(starts[i] + ck, starts[i] + ck, { scroll: false });
  }
  let nativeEnter = false;
  function afterUserInput(inputType, data) {
    const before = lastSel;
    normalizeDom();
    syncFromDom();
    if (blocks.length === 1 && !blocks[0].text && blocks[0].level) {
      // Everything was deleted: start again from a body paragraph, not a leftover heading.
      patchBlocks(0, 1, [{ level: 0, text: '' }]);
      setSel(0, 0, { scroll: false });
    }
    if (nativeEnter) { nativeEnter = false; fixNativeEnter(); }
    let kind = /^delete/.test(inputType || '') ? 'delete' : 'typing';
    fixBracketIndent();
    if (inputType === 'insertText' && data === ' ' && headingShortcut()) kind = 'format';
    commit(kind, before);
    contentChanged();
    const s = getSel();
    if (s) { lastSel = s; state.caret = s.start; }
  }

  editor.addEventListener('input', (e) => {
    scheduleFakeCaret();
    if (e.isComposing || composing) return;
    afterUserInput(e.inputType, e.data);
  });
  editor.addEventListener('compositionstart', () => { composing = true; });
  editor.addEventListener('compositionupdate', scheduleFakeCaret);
  editor.addEventListener('compositionend', () => {
    composing = false;
    // On the iPhone the next conversion can start right away; never touch the text while one is running.
    setTimeout(() => { if (!composing) afterUserInput('insertCompositionText', null); }, 0);
  });
  editor.addEventListener('beforeinput', (e) => {
    const t = e.inputType;
    if (t === 'historyUndo') { e.preventDefault(); undo(); return; }
    if (t === 'historyRedo') { e.preventDefault(); redo(); return; }
    if (t === 'insertParagraph' || t === 'insertLineBreak') {
      if (e.isComposing || composing) return;
      if (!e.cancelable) { nativeEnter = t === 'insertParagraph'; return; }
      e.preventDefault();
      if (!HL && findArmed && !findbar.hidden) {
        const s = getSel(), m = find.matches[find.index];
        if (s && m && s.start === m.s && s.end === m.e) { findStep(t === 'insertLineBreak' ? -1 : 1); return; }
      }
      findArmed = false;
      handleEnter(t === 'insertLineBreak');
      return;
    }
    if (t.startsWith('format') || t === 'insertLink' || t === 'insertFromDrop' || t === 'deleteByDrag' || t === 'insertOrderedList' || t === 'insertUnorderedList' || t === 'insertHorizontalRule') e.preventDefault();
  });
  editor.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229) return;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && !e.altKey && k === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (mod && !e.altKey && k === 'y') { e.preventDefault(); redo(); }
    else if (mod && !e.altKey && (k === 'b' || k === 'i' || k === 'u')) e.preventDefault();
    else if (mod && e.altKey && /^Digit[0-3]$/.test(e.code)) { e.preventDefault(); setLevel(Number(e.code.slice(5))); }
    else if (e.key !== 'Shift' && e.key !== 'Enter') findArmed = false;
  });
  editor.addEventListener('pointerdown', () => { findArmed = false; });
  editor.addEventListener('focus', () => {
    document.body.classList.add('editing');
    $('#btnKbClose').hidden = !isTouch;
    fitEditArea();
    scheduleFakeCaret();
  });
  editor.addEventListener('blur', () => {
    document.body.classList.remove('typing', 'editing');
    $('#btnKbClose').hidden = true;
    fitEditArea();
    scheduleFakeCaret();
  });
  editor.addEventListener('scroll', scheduleFakeCaret, { passive: true });
  editor.addEventListener('dragstart', (e) => e.preventDefault());
  editor.addEventListener('drop', (e) => e.preventDefault());

  // Copy and paste keep heading levels inside the editor, and give plain lines to other apps.
  function selectionParts(s) {
    const a = locate(s.start), z = locate(s.end);
    const parts = [];
    for (let i = a.i; i <= z.i; i++) {
      const t = blocks[i].text;
      parts.push({ level: blocks[i].level, text: t.slice(i === a.i ? a.k : 0, i === z.i ? z.k : t.length) });
    }
    return parts;
  }
  function writeClipboard(e, s) {
    const parts = selectionParts(s);
    e.clipboardData.setData('text/plain', parts.map(p => p.text).join('\n'));
    e.clipboardData.setData('text/html', '<div data-genkocho="1">' + parts.map(p => { const tag = LEVEL_TAGS[p.level].toLowerCase(); return `<${tag}>${esc(p.text)}</${tag}>`; }).join('') + '</div>');
  }
  editor.addEventListener('copy', (e) => {
    const s = getSel();
    if (!s || s.start === s.end) return;
    e.preventDefault();
    writeClipboard(e, s);
  });
  editor.addEventListener('cut', (e) => {
    const s = getSel();
    if (!s || s.start === s.end) return;
    e.preventDefault();
    writeClipboard(e, s);
    applyEdit(s.start, s.end, '', { kind: 'cut', before: s });
  });
  editor.addEventListener('paste', (e) => {
    e.preventDefault();
    const s = getSel() || lastSel;
    const html = e.clipboardData.getData('text/html');
    let text = null;
    if (html && html.includes('data-genkocho')) {
      const root = new DOMParser().parseFromString(html, 'text/html').querySelector('[data-genkocho]');
      if (root) text = Array.from(root.children, el => lineOf({ level: Math.max(0, LEVEL_TAGS.indexOf(el.tagName)), text: el.textContent })).join('\n');
    }
    if (text === null) text = (e.clipboardData.getData('text/plain') || '').replace(/\r\n?/g, '\n');
    if (!text) return;
    applyEdit(s.start, s.end, text, { markdown: true, kind: 'paste', before: s });
  });

  // In vertical writing the text scrolls sideways; let the mouse wheel do that.
  function verticalWheel(e) {
    if (!state.settings.vertical || e.ctrlKey) return;
    const el = e.currentTarget;
    if (Math.abs(e.deltaY) <= Math.abs(e.deltaX) || el.scrollWidth <= el.clientWidth) return;
    const unit = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? el.clientWidth : 1;
    el.scrollLeft -= e.deltaY * unit;
    e.preventDefault();
  }
  editor.addEventListener('wheel', verticalWheel, { passive: false });
  preview.addEventListener('wheel', verticalWheel, { passive: false });
  document.addEventListener('mousemove', (e) => {
    if (document.body.classList.contains('typing') && Math.abs(e.movementX) + Math.abs(e.movementY) > 6) document.body.classList.remove('typing');
  });

  function ins(kind) {
    if (viewMode !== 'edit') setView('edit');
    const s = getSel() || lastSel;
    const sel = plainText().slice(s.start, s.end);
    if ((kind === 'ruby' || kind === 'bouten') && sel.includes('\n')) { toast(kind === 'ruby' ? 'ルビは1行の中の文字に振ってください' : '傍点は1行の中の文字に付けてください'); return; }
    // Pressed again after typing the reading: move out of 《》 and keep writing.
    if ((kind === 'ruby' || kind === 'bouten') && !sel && exitBrackets(s)) return;
    switch (kind) {
      case 'ruby':
        if (sel) applyEdit(s.start, s.end, '｜' + sel + '《》', { caret: s.start + sel.length + 2, before: s });
        else if (/[\p{Script=Han}々〆ヵヶ]$/u.test(plainText().slice(Math.max(0, s.start - 2), s.start))) applyEdit(s.start, s.start, '《》', { caret: s.start + 1, before: s });
        else { toast('ルビを振る文字を選んでから押してください（漢字の直後なら、そのまま押せます）'); setSel(s.start, s.end, { scroll: false }); }
        break;
      case 'bouten': applyEdit(s.start, s.end, '《《' + sel + '》》', { caret: sel ? s.start + sel.length + 4 : s.start + 2, before: s }); break;
      case 'dash': applyEdit(s.start, s.end, '――', { before: s }); break;
      case 'leader': applyEdit(s.start, s.end, '……', { before: s }); break;
    }
  }
  // Toolbar buttons must not take focus away from the text, or the selection and the phone keyboard go away.
  const keepFocus = (e) => { if (e.target.closest('[data-ins], [data-keep], #btnLevel, #levelPop button')) e.preventDefault(); };
  for (const el of [$('#barTools'), $('#levelPop'), findbar]) {
    el.addEventListener('pointerdown', keepFocus);
    el.addEventListener('mousedown', keepFocus);
  }
  $('#toolInput').addEventListener('click', (e) => { const b = e.target.closest('[data-ins]'); if (b && !b.disabled) ins(b.dataset.ins); });

  document.addEventListener('selectionchange', () => {
    scheduleFakeCaret();
    if (composing) return;
    if (Date.now() < kbSettleUntil && document.activeElement === editor) requestAnimationFrame(revealCaret);
    const s = getSel();
    if (!s) { if (document.activeElement !== editor) $('#cntSel').hidden = true; return; }
    lastSel = s;
    state.caret = s.start;
    scheduleCaretUi();
  });

  // ---------- caret-dependent UI: paragraph type, breadcrumb, selection count ----------
  let caretUiQueued = false, lastHead = -2, lastCrumbKey = '';
  function scheduleCaretUi() {
    if (caretUiQueued) return;
    caretUiQueued = true;
    requestAnimationFrame(() => { caretUiQueued = false; updateCaretUi(); });
  }
  function nearestHeading(ci) { for (let i = Math.min(ci, blocks.length - 1); i >= 0; i--) if (blocks[i].level) return i; return -1; }
  function headingPath(ci) {
    const path = [];
    let min = 4;
    for (let i = Math.min(ci, blocks.length - 1); i >= 0 && min > 1; i--) {
      const L = blocks[i].level;
      if (L && L < min) { path.unshift(i); min = L; }
    }
    return path;
  }
  function updateCaretUi() {
    const ci = locate(lastSel.start).i;
    const lvl = blocks[ci] ? blocks[ci].level : 0;
    $('#levelLabel').textContent = LEVEL_NAMES[lvl];
    for (const b of document.querySelectorAll('#levelPop [data-level]')) b.setAttribute('aria-checked', String(Number(b.dataset.level) === lvl));
    const path = headingPath(ci);
    const key = path.map(i => i + ':' + blocks[i].text).join('|') + '#' + state.title;
    if (key !== lastCrumbKey) {
      lastCrumbKey = key;
      const crumb = $('#crumb');
      crumb.textContent = '';
      if (!path.length) {
        const s = document.createElement('span');
        s.className = 'crumb-title';
        s.textContent = state.title || '無題の作品';
        crumb.append(s);
      }
      path.forEach((i, j) => {
        if (j) { const sp = document.createElement('span'); sp.className = 'crumb-sep'; sp.textContent = '›'; crumb.append(sp); }
        const s = document.createElement('span');
        s.className = 'crumb-part';
        s.textContent = blocks[i].text || '（無題の見出し）';
        crumb.append(s);
      });
    }
    const showSel = viewMode === 'edit' && lastSel.end > lastSel.start && document.activeElement === editor;
    $('#cntSel').hidden = !showSel;
    if (showSel) $('#cntSelN').textContent = fmt(countChars(plainText().slice(lastSel.start, lastSel.end)));
    const h = nearestHeading(ci);
    if (h !== lastHead) { lastHead = h; scheduleStats(); }
  }

  // ---------- counts and outline ----------
  const metricCache = new Map();
  const HEAD_METRIC = { chars: 0, rows: 0 };
  function blockMetric(b) {
    if (b.level) return HEAD_METRIC;
    let m = metricCache.get(b.text);
    if (!m) {
      const s = stripMarkup(b.text);
      m = { chars: cpLen(s.replace(/[\s　]/g, '')), rows: Math.max(1, Math.ceil(cpLen(s) / 20)) };
      if (metricCache.size > 20000) metricCache.clear();
      metricCache.set(b.text, m);
    }
    return m;
  }
  let analysis = null;
  function analyze() {
    const n = blocks.length;
    const pc = new Array(n + 1), pr = new Array(n + 1);
    pc[0] = 0; pr[0] = 0;
    for (let i = 0; i < n; i++) { const m = blockMetric(blocks[i]); pc[i + 1] = pc[i] + m.chars; pr[i + 1] = pr[i] + m.rows; }
    const heads = [];
    for (let i = 0; i < n; i++) if (blocks[i].level) heads.push(i);
    const sections = heads.map((h, idx) => {
      const L = blocks[h].level;
      let end = n;
      for (let j = idx + 1; j < heads.length; j++) if (blocks[heads[j]].level <= L) { end = heads[j]; break; }
      return { i: h, level: L, end, chars: pc[end] - pc[h + 1], rows: pr[end] - pr[h + 1] };
    });

  function updateFind({ from = lastSel.start, scroll = true } = {}) {

  function findStep(dir) {

  function openFind() {

  function closeFind() {
    abortAi();

    findOpts.talk = 0;

  }

  // Where the matches are in the whole manuscript: a strip that runs the way the text does (right to left
  // in vertical writing), with a tick at each top-level heading. Tap it to jump to the nearest match.
  function drawFindMap() {
    const n = find.matches.length;

    if (findMap.hidden) return;
    const w = findMap.clientWidth, h = 12, dpr = window.devicePixelRatio || 1;

    for (let i = 0; i < blocks.length; i++) if (blocks[i].level === top) g.fillRect(X(starts[i]), 2, 1, h - 4);
    g.fillStyle = 'rgba(226, 150, 30, 0.85)';

  // ---------- AI search: passages found by what happens in them, not by their words ----------
  // Asks the viewer's own Claude (the page's `sample` capability), only when they press Enter. Long

  let sampleFn = null, aiCtl = null, aiBusy = false;
  const AI_CHUNK = 150000;
  if (window.claude && typeof window.claude.use === 'function') {

  function setAiStatus(msg, busy = false) {

  const aiPrompt = (q, lines) => [
    '次の小説の原稿から、問い合わせに合う箇所を探してください。',
    '',
    '問い合わせ：' + q,
    '',
    '答え方：',
    '- 合う箇所1つにつき1行で、次の形の JSON だけを書く。ほかの文は書かない。',
    '  {"p": 段落番号, "quote": "段落の本文から一字一句そのまま抜き出した、いちばん合う部分（40字まで）", "why": "合う理由（25字まで）", "score": 合う度合い（1〜10の整数）}',
    '- 合う度合いの高い順に、多くても15件。合う箇所がなければ何も書かない。',
    '- 段落番号は各行の先頭の [ ] の中の数。行頭の # は見出しの印で、本文ではない。',
    '- quote は本文にあるとおりに書く（《》や｜などの記号もそのまま）。',
    '',
    '原稿：',

  // Where Claude's quote is: in the paragraph it named, else in the nearest paragraph that has it; exactly,
  // else ignoring variants (ruby marks, kana, width). Failing that, the start of the named paragraph.
  function locateQuote(i, quote) {
    const qf = foldText(quote, null).str;
    const exact = (j) => { const k = blocks[j].text.indexOf(quote); return k >= 0 ? [k, k + quote.length] : null; };
    const loose = (j) => {
      const f = folded(blocks[j].text);
      for (const F of [f.D, f.R]) { const k = F.str.indexOf(qf); if (k >= 0) return [F.from[k], F.to[k + qf.length - 1]]; }
      return null;
    };
    for (const at of quote ? (qf ? [exact, loose] : [exact]) : []) {
      const here = at(i);
      if (here) return [i, here];
      if (quote.length < 2) continue;
      let best = -1, span = null;
      for (let j = 0; j < blocks.length; j++) {
        if (!blocks[j].text || (best >= 0 && Math.abs(j - i) >= Math.abs(best - i))) continue;
        const x = at(j);
        if (x) { best = j; span = x; }
      }
      if (span) return [best, span];
    }
    return [i, [0, Math.min(blocks[i].text.length, 40)]];
  }
  function addAiHit(line, ctl) {
    if (aiCtl !== ctl || ctl.signal.aborted) return;
    const src = line.trim().replace(/^[-*・]\s*/, '').replace(/,$/, '');
    if (!src.startsWith('{')) return;
    let o;
    try { o = JSON.parse(src); } catch { return; }
    const n = Number(o && o.p);
    if (!Number.isInteger(n) || !blocks[n] || !blocks[n].text) return;
    const [i, [a, z]] = locateQuote(n, String(o.quote || ''));
    const t = blocks[i].text;
    const hit = { s: starts[i] + a, e: starts[i] + z, i, why: String(o.why || '').slice(0, 80), score: Number(o.score) || 0, quote: t.slice(a, z) };
    if (find.matches.some((m) => m.s < hit.e && hit.s < m.e)) return;
    find.matches.push(hit);
    find.matches.sort((x, y) => y.score - x.score || x.s - y.s);
    paintFind();
    showFindCount();
  }
  // After edits, AI hits follow their quoted text (or are dropped when it is gone).
  function relocateAi() {
    const text = plainText();
    find.matches = find.matches.filter((h) => {
      if (text.slice(h.s, h.e) === h.quote) return true;
      if (!h.quote) return false;
      const a = text.lastIndexOf(h.quote, h.s), b = text.indexOf(h.quote, h.s);
      const k = a < 0 ? b : b < 0 ? a : h.s - a <= b - h.s ? a : b;
      if (k < 0) return false;
      h.s = k; h.e = k + h.quote.length; h.i = locate(k).i;
      return true;
    });
  }
  function aiErrorText(e) {
    switch (e && e.code) {
      case 'not_granted': case 'sampling_disabled': case 'not_declared': case 'capability_disabled': case 'capability_removed':
        return 'この画面では AI 検索を使えません（許可されていないか、使えない設定です）';
      case 'rate_limited': return 'AI の利用が上限に達したか、混み合っています。しばらくしてから試してください';
      case 'session_expired': return 'Claude にもう一度ログインしてください';
      case 'prompt_too_large': return '原稿が長すぎました。「この章」に絞って試してください';
      case 'refused': return 'AI がこの問い合わせには答えませんでした。言い方を変えて試してください';
      default: return 'AI との通信に失敗しました。もう一度試してください';
    }
  }
  async function runAi() {
    const q = $('#findQ').value.trim();
    if (!q || !sampleFn) return;
    abortAi();
    const ctl = aiCtl = new AbortController();
    let lo = 0, hi = blocks.length, label = '原稿全体';
    if (findOpts.chapter) ({ lo, hi, label } = chapterSpan());
    const enc = new TextEncoder(), chunks = [];
    let cur = [], bytes = 0;
    for (let i = lo; i < hi; i++) {
      const b = blocks[i];
      if (!b.text) continue;
      let line = `[${i}] ${b.level ? '#'.repeat(b.level) + ' ' : ''}${b.text}`;
      let n = enc.encode(line).length + 1;
      if (n > AI_CHUNK) { line = line.slice(0, Math.floor(AI_CHUNK / 4)); n = enc.encode(line).length + 1; }
      if (bytes + n > AI_CHUNK && cur.length) { chunks.push(cur); cur = []; bytes = 0; }
      cur.push(line);
      bytes += n;
    }
    if (cur.length) chunks.push(cur);
    find.aiQ = q;
    find.matches = [];
    find.index = -1;
    clearFindPaint();
    if (!chunks.length) { aiCtl = null; setAiStatus('探す本文がありません'); showFindCount(); return; }
    let done = 0, error = null, next = 0;
    const progress = () => setAiStatus(`AI が${label}を読んで探しています${chunks.length > 1 ? `（${done} / ${chunks.length}）` : ''}…数十秒かかることがあります`, true);
    progress();
    showFindCount();
    const ask = async (lines) => {
      let pending = '';
      const eat = (delta) => { const ls = (pending + delta).split('\n'); pending = ls.pop(); for (const l of ls) addAiHit(l, ctl); };
      try { await sampleFn(aiPrompt(q, lines), { signal: ctl.signal, onText: ({ delta }) => eat(delta) }); }
      catch (e) { if (!error && !(e && e.code === 'cancelled')) error = e || {}; }
      if (pending) addAiHit(pending, ctl);
      done++;
      if (aiCtl === ctl && !error && !ctl.signal.aborted) progress();
    };
    const lane = async () => { while (next < chunks.length && !ctl.signal.aborted && !error) await ask(chunks[next++]); };
    await Promise.all([lane(), lane()]);
    if (aiCtl !== ctl) return;
    aiCtl = null;
    const n = find.matches.length;
    const permanent = error && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(error.code);
    if (permanent) {
      sampleFn = null;
      $('#optAi').hidden = true;
      toast(aiErrorText(error));
      setAiMode(false);
      return;
    }
    if (error) setAiStatus(aiErrorText(error) + (n ? `（見つかった ${n}件は残しています）` : ''));
    else if (ctl.signal.aborted) setAiStatus(n ? `途中で止めました（${n}件）` : '止めました');
    else setAiStatus(n ? `AI が ${n}件見つけました（合う順）` : 'AI は合う箇所を見つけられませんでした。言い方を変えて試してください');
    if (n) find.index = 0;
    paintFind();
    showFindCount();
    if (n && !error && !ctl.signal.aborted) { revealMatch(); if (panel !== 'search') openPanel('search'); }
  }

  $('#btnFind').addEventListener('click', () => (findbar.hidden ? openFind() : closeFind()));
