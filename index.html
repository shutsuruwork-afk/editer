  // ---------- notation check ----------
  const CHECKS = [
    { re: /(?<!…)…(?!…)/g, msg: '三点リーダーは「……」と２つ続けて使います' },
    { re: /・{2,}|\.{3,}|。{2,}/g, msg: '「……」（三点リーダー２つ）を使いましょう' },
    { re: /(?<!―)―(?!―)/g, msg: 'ダッシュは「――」と２つ続けて使います' },
    { re: /[！？!?]+(?=[^！？!?\s　」』）)\]〉》】])/g, msg: '「！」「？」の後には全角スペースを１つ空けます' },
    { re: /[!?]+/g, msg: '縦書きでは全角の「！」「？」がおすすめです', verticalOnly: true },
    { re: /。(?=[」』])/g, msg: '閉じかっこの直前の「。」は省くのが一般的です' },
    { re: /^(?=[^\s　「『（(〈《【〔［“"―…＊*◇◆□■○●☆★※])./gu, msg: '段落の頭が字下げされていません' },
  ];
  function runChecks() {
    const hits = [];
    for (let i = 0; i < blocks.length && hits.length < 500; i++) {
      const b = blocks[i];
      if (b.level || !b.text) continue;
      for (const rule of CHECKS) {
        if (rule.verticalOnly && !state.settings.vertical) continue;
        for (const m of b.text.matchAll(rule.re)) hits.push({ i, start: starts[i] + m.index, end: starts[i] + m.index + m[0].length, msg: rule.msg });
      }
      const count = (re) => (b.text.match(re) || []).length;
      if (count(/「/g) !== count(/」/g) || count(/『/g) !== count(/』/g)) hits.push({ i, start: starts[i], end: starts[i] + b.text.length, msg: 'この段落のかぎかっこの開きと閉じの数が合っていません', whole: true });
    }
    return hits.sort((x, y) => x.start - y.start);
  }
  let checkTimer = null;
  function scheduleCheck() { clearTimeout(checkTimer); checkTimer = setTimeout(renderCheck, 600); }
  function renderCheck() {
    const ul = $('#checkList');
    if (!ul) return;
    ul.textContent = '';
    const hits = runChecks();
    if (HL) { const h = new Highlight(); for (const x of hits) h.add(rangeAt(x.start, x.end)); CSS.highlights.set('check', h); }
    if (!hits.length) { ul.innerHTML = '<li class="ok-note">気になる箇所は見つかりませんでした。</li>'; return; }
    const text = plainText();
    for (const h of hits.slice(0, 300)) {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'hit';
      b.dataset.s = h.start;
      b.dataset.e = h.end;
      const ls = starts[h.i], le = ls + blocks[h.i].text.length;
      const a = Math.max(ls, h.start - 10), z = Math.min(le, h.end + 10);
      const markEnd = h.whole ? Math.min(h.end, h.start + 20) : h.end;
      const head = nearestHeading(h.i);
      const where = head >= 0 ? (blocks[head].text || '無題の見出し') : '冒頭';
      b.innerHTML = `<span class="where">${esc(where)}</span><span class="msg">${esc(h.msg)}</span>`
        + `<span class="snip">${a > ls ? '…' : ''}${esc(text.slice(a, h.start))}<mark>${esc(text.slice(h.start, markEnd) || '␣')}</mark>${esc(text.slice(markEnd, Math.max(markEnd, z)))}${z < le ? '…' : ''}</span>`;
      li.append(b);
      ul.append(li);
    }
    ul.onclick = (e) => {
      const b = e.target.closest('.hit');
      if (!b) return;
      const a = Number(b.dataset.s), z = Number(b.dataset.e);
      if (viewMode !== 'edit') setView('edit');
      if (!isTouch) { setSel(a, z); return; }
      // On a phone the list covers the text: close it, show the spot, and offer a way back.
      if (document.body.classList.contains('mobile')) {
        openPanel(null);
        toast('該当箇所に移動しました', '一覧に戻る', () => openPanel('check'));
      }
      reveal(a, z);
    };
  }

  // ---------- settings ----------
  function setupSettings() {
    const s = state.settings;
    const bind = (id, key, parse, label) => {
      const el = $('#' + id);
      const show = () => { if (label) $('#' + id + 'V').textContent = label(s[key]); };
      if (el.type === 'checkbox') el.checked = !!s[key]; else el.value = s[key];
      show();
      el.addEventListener(el.type === 'range' ? 'input' : 'change', () => {
        setSetting(key, el.type === 'checkbox' ? el.checked : parse(el.value));
        show();
      });
    };
    bind('setFont', 'font', String);
    if (isTouch) $('#setFs').min = 16;
    bind('setFs', 'fs', Number, v => (isTouch ? Math.max(16, v) : v) + 'px');
    bind('setLh', 'lh', Number, v => Number(v).toFixed(1));
    bind('setLc', 'lineChars', Number, v => v + '字');
    bind('setIndent', 'autoIndent', Boolean);
    bind('setDim', 'dimWhileTyping', Boolean);
    bind('setTcy', 'tcy', Boolean);
  }

  // ---------- export / import ----------
  async function saveFile(filename, text) {
    const c = window.claude;
    const dl = c && typeof c.use === 'function' ? await c.use('downloads') : null;
    if (dl) {
      try { await dl.save({ filename, data: text }); toast('書き出しました'); }
      catch (e) { if (!e || e.code !== 'declined') toast('書き出せませんでした' + (e && e.message ? '：' + e.message : '')); }
      return;
    }
    const mime = filename.endsWith('.md') ? 'text/markdown' : 'text/plain';
    const url = URL.createObjectURL(new Blob([text], { type: mime + ';charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }
  const safeName = (s) => (s || '無題').replace(/[\\/:*?"<>|\n\r\t]/g, '_').trim().slice(0, 60) || '無題';
  const stamp = (t) => new Date(t || Date.now()).toISOString().slice(0, 10);
  const mdFile = (title, md) => `---\ntitle: ${JSON.stringify(title || '')}\n---\n${md}\n`;
  function parseMdFile(text) {
    let title = null, body = text;
    const fm = /^---\n([\s\S]*?)\n---\n?/.exec(text);
    if (fm) {
      body = text.slice(fm[0].length);
      const m = /^title:\s*(.*)$/m.exec(fm[1]);
      if (m) { const v = m[1].trim(); try { title = v.startsWith('"') ? JSON.parse(v) : v; } catch { title = v; } }
    }
    if (body.endsWith('\n')) body = body.slice(0, -1);
    return { title, md: body };
  }
  function currentSectionLines() {
    const a = analysis || analyze();
    const cur = sectionAt(a, locate(lastSel.start).i);
    return blocks.slice(cur.start, cur.end).map(b => b.text).join('\n').replace(/^\n+|\n+$/g, '');
  }
  function confirmBox(message, okLabel, onOk) {
    const box = $('#importConfirm');
    box.textContent = '';
    const div = document.createElement('div');
    div.className = 'confirm-box';
    const p = document.createElement('span');
    p.textContent = message;
    const row = document.createElement('div');
    row.className = 'row';
    const ok = document.createElement('button'); ok.type = 'button'; ok.className = 'btn danger'; ok.textContent = okLabel;
    const no = document.createElement('button'); no.type = 'button'; no.className = 'btn'; no.textContent = 'やめる';
    ok.onclick = () => { box.textContent = ''; onOk(); };
    no.onclick = () => { box.textContent = ''; };
    row.append(ok, no);
    div.append(p, row);
    box.append(div);
  }
  function replaceDocument(title, md) {
    const before = lastSel;
    if (title != null) state.title = title;
    blocks = fromMd(md);
    renderEditor();
    commit('import', before);
    $('#workTitle').value = state.title;
    lastCrumbKey = '';
    setSel(0, 0, { focus: !isTouch });
    editor.scrollTop = 0; editor.scrollLeft = 0;
    updateDocTitle();
    contentChanged();
    toast('読み込みました（Ctrl/⌘+Z で元に戻せます）');
  }
  function renderRecovered() {
    const box = $('#recoveredBox');
    if (!box) return;
    box.textContent = '';
    const r = state.recovered;
    if (!r) return;
    const div = document.createElement('div');
    div.className = 'note-box';
    const p = document.createElement('span');
    p.textContent = `同期の際に使われなかった版（${new Date(r.at || Date.now()).toLocaleString('ja-JP')}）が残っています。`;
    const row = document.createElement('div');
    row.className = 'row';
    const ex = document.createElement('button'); ex.type = 'button'; ex.className = 'btn'; ex.textContent = 'その版を .md で書き出す';
    const rm = document.createElement('button'); rm.type = 'button'; rm.className = 'btn'; rm.textContent = '破棄する';
    ex.onclick = () => saveFile(`${safeName(r.title)}_別の版_${stamp(r.at)}.md`, mdFile(r.title, r.md));
    rm.onclick = () => { state.recovered = null; saveLocalSoon(); renderRecovered(); };
    row.append(ex, rm);
    div.append(p, row);
    box.append(div);
  }
  function setupFile() {
    $('#storageNote').textContent = cloud.mode === 'cloud'
      ? '原稿は claude.ai のあなたのアカウントに保存され、ほかの人には見えません。'
      : '原稿はこのブラウザに保存されています。ブラウザのデータを消すと失われるため、ときどき .md を書き出して保管してください。';
    renderRecovered();
    $('#expMd').addEventListener('click', () => saveFile(`${safeName(state.title)}_${stamp()}.md`, mdFile(state.title, state.md)));
    $('#expTxt').addEventListener('click', () => saveFile(safeName(state.title) + '.txt', (state.title ? state.title + '\n\n' : '') + plainText() + '\n'));
    $('#copySection').addEventListener('click', () => {
      const text = currentSectionLines();
      const fallback = () => toast('コピーできませんでした。本文を選んで Ctrl/⌘+C でコピーしてください');
      try { navigator.clipboard.writeText(text).then(() => toast('この章の本文をコピーしました'), fallback); } catch { fallback(); }
    });
    $('#importFile').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const buf = await file.arrayBuffer();
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) { try { text = new TextDecoder('shift_jis').decode(buf); } catch { /* keep utf-8 */ } }
      text = text.replace(/^﻿/, '').replace(/\r\n?/g, '\n');
      const base = file.name.replace(/\.[^.]+$/, '');
      if (/\.(md|markdown)$/i.test(file.name)) {
        const { title, md } = parseMdFile(text);
        confirmBox(`「${title || base}」で、いまの原稿をすべて置き換えます。`, '置き換える', () => replaceDocument(title ?? state.title, md));
      } else if (/\.json$/i.test(file.name)) {
        let data = null;
        try { data = JSON.parse(text); } catch { data = null; }
        if (!data || data.app !== 'genkocho' || !Array.isArray(data.chapters) || !data.chapters.length) { toast('原稿帳のバックアップファイルではありません'); return; }
        confirmBox(`「${data.title || '無題'}」（${data.chapters.length}章）で、いまの原稿をすべて置き換えます。各章は大見出しになります。`, '置き換える', () => replaceDocument(String(data.title || ''), chaptersToMd(data.chapters)));
      } else {
        const before = lastSel;
        const add = [{ level: 1, text: base }, ...text.replace(/\n$/, '').split('\n').map(t => ({ level: 0, text: t }))];
        const at = blocks.length === 1 && !blocks[0].text ? 0 : blocks.length;
        blocks = at === 0 ? add : blocks.concat(add);
        renderEditor();
        commit('import', before);
        if (isTouch) lastSel = { start: starts[at], end: starts[at] }; else setSel(starts[at], starts[at], { scroll: false });
        scrollToStart(editor, editor.children[at]);
        contentChanged();
        toast(`「${base}」を大見出しの章として末尾に追加しました`);
      }
    });
  }

  // ---------- toast ----------
  let toastTimer = null;
  function toast(msg, actLabel, actFn) {
    const t = $('#toast'), act = $('#toastAct');
    $('#toastMsg').textContent = msg;
    act.hidden = !actLabel;
    act.textContent = actLabel || '';
    act.onclick = actLabel ? () => { t.hidden = true; actFn(); } : null;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, actLabel ? 7000 : Math.max(2800, msg.length * 90));
  }

  // ---------- keyboard ----------
  document.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key.toLowerCase();
    if (mod && k === 's') { e.preventDefault(); saveLocalNow(); flush(); toast('保存しました'); }
    else if (mod && k === 'f') { e.preventDefault(); openFind(); }
    else if ((mod && k === 'g') || e.key === 'F3') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape' && !e.isComposing) {
      if (openPop) { const b = openPop.btn; closePop(); if (b.id === 'btnLevel') setSel(lastSel.start, lastSel.end, { scroll: false }); else b.focus(); }
      else if (drawerOpen()) { setDrawer(false); $('#btnDrawer').focus(); }
      else if (!findbar.hidden) closeFind();
      else if (panel) openPanel(null);
      else if (viewMode === 'preview') setView('edit');
      else return;
      e.preventDefault();
    }
  });

  window.addEventListener('beforeunload', () => { saveLocalNow(); flush(); });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { saveLocalNow(); flush(); } });

  applyMobile();
  setView('edit');
  loadDocument(true);
  updateSaveState();
  initCloud();
})();
</script>
</body>
</html>
